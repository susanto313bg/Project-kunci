<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT. Bringin Gigantara - Management Kunci</title>
    <!-- Tailwind CSS untuk styling modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .page-break { page-break-after: always; break-after: page; }
        }
        /* Efek sel aktif ala Excel */
        .tid-cell-selected {
            background-color: #FEF08A !important; /* Kuning cerah */
            outline: 2px solid #2563EB !important; /* Border biru tebal */
            z-index: 10;
            position: relative;
        }
    </style>
</head>
<body class="bg-[#EBF2FA] font-sans antialiased min-h-screen flex flex-col">

    <!-- LAYAR LOGIN -->
    <div id="loginScreen" class="fixed inset-0 bg-[#1E293B] flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-lg w-[380px] text-center">
            <h2 class="text-xl font-bold text-[#1E3A8A]">PT. Bringin Gigantara</h2>
            <p class="text-xs italic text-slate-500 mb-6">Integrated Cash Solutions</p>
            
            <label class="block text-left text-sm font-medium text-slate-700 mb-2">Masukkan Password Akses:</label>
            <input type="password" id="loginPass" class="w-full text-center text-lg border border-slate-300 rounded p-2 mb-4 focus:outline-none focus:border-blue-600" placeholder="••••" autofocus onkeypress="if(event.key === 'Enter') handleLogin()">
            
            <button onclick="handleLogin()" class="w-full bg-[#1E3A8A] text-white font-bold py-2 rounded hover:bg-blue-900 transition">LOGIN</button>
        </div>
    </div>

    <!-- APLIKASI UTAMA (Disembunyikan sebelum login) -->
    <div id="mainApp" class="hidden flex flex-col flex-1">
        <!-- Header -->
        <header class="bg-[#0F172A] h-20 flex items-center justify-between px-6 text-white shadow">
            <div class="flex items-center space-x-3">
                <span class="text-3xl font-bold text-[#F97316]">∞ bgi</span>
                <span class="text-xs text-slate-400 leading-tight">Integrated<br>Cash Solutions</span>
            </div>
            <h1 class="text-xl font-bold tracking-wide">PT. Bringin Gigantara</h1>
        </header>

        <!-- Sub-bar Version -->
        <div class="bg-[#CBD5E1] px-6 py-1 text-xs font-bold text-[#334155] pl-[170px]">
            NEWCRO_PHP_V7 (WEB VERSION)
        </div>

        <!-- Body Content -->
        <div class="flex flex-1 p-3 gap-3">
            <!-- Sidebar -->
            <aside class="w-[200px] flex flex-col gap-3">
                <div class="bg-[#DBEAFE] border border-blue-200 p-3 rounded text-xs">
                    <div id="sidebarRole" class="font-bold text-[#1E3A8A] text-center mb-2">TEKNISI<br>BG BEKASI</div>
                    <div class="space-y-1 font-mono text-[11px] text-slate-800">
                        <div>USER ID : <span id="lblUserId">---</span></div>
                        <div>NAMA : <span id="lblUserName">---</span></div>
                        <div>DATE : <span id="lblDate">---</span></div>
                        <div>LOGIN : <span id="lblLoginTime">---</span></div>
                    </div>
                </div>

                <button onclick="renderTeamMenuHtml()" class="text-left bg-[#DBEAFE] hover:bg-blue-200 text-[#1E3A8A] font-bold py-2 px-3 rounded text-xs transition">
                    🌺 CETAK KUNCI RPL
                </button>
                <button onclick="location.reload()" class="text-left bg-[#FEE2E2] hover:bg-red-200 text-[#991B1B] font-bold py-2 px-3 rounded text-xs transition">
                    🚨 Logout
                </button>
            </aside>

            <!-- Main Dynamic Content Area -->
            <main id="contentArea" class="flex-1 bg-white p-4 rounded shadow-sm border border-slate-200 overflow-y-auto">
                <div class="flex items-center justify-center h-full text-slate-400 italic">
                    Silakan klik tombol 'CETAK KUNCI RPL' di menu sebelah kiri.
                </div>
            </main>
        </div>
    </div>

    <script>
        let currentUser = null;
        let batchTeamsData = {}; 
        let batchTeamMembers = {}; 
        let previewPayload = [];
        let currentSlideIndex = 0;

        const teamsList = [
            "TEAM RPL MALAM 1", "TEAM RPL MALAM 2", "*",
            "TEAM RPL PAGI 1", "TEAM RPL PAGI 2", "TEAM RPL PAGI 3", "TEAM RPL PAGI 4", "TEAM RPL PAGI 5", "TEAM RPL PAGI 6", "TEAM RPL PAGI 7", "TEAM RPL PAGI 8", "TEAM RPL PAGI 9", "*",
            "TEAM RPL MIDLE 1", "TEAM RPL MIDLE 2", "TEAM RPL MIDLE 3", "*",
            "TEAM RPL SIANG 1", "TEAM RPL SIANG 2", "TEAM RPL SIANG 3", "TEAM RPL SIANG 4"
        ];

        async function handleLogin() {
            const pwd = document.getElementById("loginPass").value.trim();
            const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password: pwd })
            });
            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                document.getElementById("loginScreen").classList.add("hidden");
                document.getElementById("mainApp").classList.remove("hidden");
                
                document.getElementById("sidebarRole").innerHTML = `${currentUser.role}<br>BG BEKASI`;
                document.getElementById("lblUserId").innerText = currentUser.id;
                document.getElementById("lblUserName").innerText = currentUser.name;
                document.getElementById("lblDate").innerText = currentUser.today_date;
                document.getElementById("lblLoginTime").innerText = currentUser.login_time;

                renderTeamMenuHtml();
            } else {
                alert(data.message);
            }
        }

        function renderTeamMenuHtml() {
            const content = document.getElementById("contentArea");
            
            // Periksa apakah ada minimal satu team yang sudah diisi datanya
            let hasData = Object.values(batchTeamsData).some(tids => tids && tids.length > 0);

            let html = `
                <div class="flex justify-between items-center mb-4 pb-2 border-b">
                    <span class="font-bold text-slate-700">Pilih Team RPL</span>
                    ${hasData ? `<button onclick="preparePreview(batchTeamsData)" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded">🖨️ Pratinjau / Cetak Semua Team</button>` : ''}
                </div>
                <div class="grid grid-cols-1 gap-2 max-w-md">
            `;

            teamsList.forEach(team => {
                if (team === "*") {
                    html += `<div class="bg-slate-200 text-center text-slate-500 font-bold text-xs py-1">*</div>`;
                } else {
                    let isFilled = batchTeamsData[team] && batchTeamsData[team].length > 0;
                    let btnText = isFilled ? `✓ ${team} (${batchTeamsData[team].length} TID)` : team;
                    let btnBg = isFilled ? "bg-emerald-100 text-emerald-800 border-emerald-300" : "bg-white text-slate-800 border-slate-200 hover:bg-slate-50";
                    
                    html += `<button onclick="openTeamInput('${team}')" class="text-left border px-4 py-2 rounded text-sm font-bold transition ${btnBg}">${btnText}</button>`;
                }
            });

            html += `</div>`;
            content.innerHTML = html;
        }

        function openTeamInput(teamName) {
            const content = document.getElementById("contentArea");
            
            // Ambil data sementara dari input di layar jika ada, atau dari memori tersimpan
            let previousTids = [];
            let activeInputs = document.querySelectorAll(".tid-input");
            if (activeInputs.length > 0) {
                activeInputs.forEach(inp => previousTids.push(inp.value.trim()));
            } else {
                previousTids = batchTeamsData[teamName] || [];
            }

            let memberElem = document.getElementById("inputTeamMember");
            let previousMemberName = memberElem ? memberElem.value : (batchTeamMembers[teamName] || "");

            let html = `
                <div class="mb-4">
                    <button onclick="saveAndReturnMenu('${teamName}')" class="bg-slate-500 hover:bg-slate-600 text-white text-xs font-bold px-3 py-1.5 rounded mb-3">⬅ Kembali ke Daftar Team</button>
                    <div class="text-xs text-slate-500 font-semibold">INPUT TID - ${teamName}</div>
                </div>

                <div class="border border-slate-400 rounded overflow-hidden inline-block mb-4 bg-white shadow-sm">
                    <table class="border-collapse text-sm">
                        <thead>
                            <tr>
                                <th colspan="2" class="bg-amber-500 border border-slate-400 p-1.5 text-left">
                                    <input type="text" id="inputTeamMember" value="${previousMemberName}" placeholder="MASUKKAN NAMA TEAM..." class="w-full bg-amber-500 text-black font-bold placeholder-slate-700 px-1 py-0.5 border-none outline-none text-sm uppercase" oninput="autoSaveDraft('${teamName}')">
                                </th>
                            </tr>
                            <tr class="bg-emerald-600 text-white">
                                <th class="border border-slate-400 p-1 w-10 text-center font-bold text-xs">NO</th>
                                <th class="border border-slate-400 p-1 px-2 font-bold text-center w-24 text-xs">TID</th>
                            </tr>
                        </thead>
                        <tbody id="tidTableBody">
            `;

            for (let i = 0; i < 16; i++) {
                let val = previousTids[i] || "";
                html += `
                    <tr>
                        <td class="border border-slate-400 p-1 text-center font-bold text-slate-700 text-xs">${i + 1}</td>
                        <td class="border border-slate-400 p-0.5 cell-container" data-index="${i}">
                            <input type="text" maxlength="15" class="tid-input w-full px-1 py-0.5 border-none text-sm text-center outline-none bg-transparent" value="${val}" data-index="${i}" oninput="autoSaveDraft('${teamName}')">
                        </td>
                    </tr>
                `;
            }

            html += `
                        </tbody>
                    </table>
                </div>
                <div class="flex gap-2 w-[180px]">
                    <button onclick="saveTeamAndPrint('${teamName}')" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold px-2 py-2 rounded">🖨️ Cetak</button>
                    <button onclick="saveAndReturnMenu('${teamName}')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-2 py-2 rounded">💾 Simpan</button>
                </div>
            `;

            content.innerHTML = html;

            setupExcelInteractions();
        }

        // Simpan otomatis ke memori setiap ada ketikan agar tidak hilang
        function autoSaveDraft(teamName) {
            let memberName = document.getElementById("inputTeamMember") ? document.getElementById("inputTeamMember").value.trim() : "";
            let inputs = document.querySelectorAll(".tid-input");
            let tids = [];
            inputs.forEach(inp => {
                if(inp.value.trim() !== "") tids.push(inp.value.trim());
            });

            batchTeamsData[teamName] = tids;
            if(memberName) batchTeamMembers[teamName] = memberName;
        }

        function saveAndReturnMenu(teamName) {
            autoSaveDraft(teamName);
            renderTeamMenuHtml();
        }

        function saveTeamAndPrint(teamName) {
            autoSaveDraft(teamName);
            let tids = batchTeamsData[teamName] || [];
            if (tids.length === 0) {
                alert("Harap masukkan minimal 1 TID!");
                return;
            }
            let singleData = {};
            singleData[teamName] = tids;
            preparePreview(singleData);
        }

        function setupExcelInteractions() {
            const inputs = document.querySelectorAll(".tid-input");
            const containers = document.querySelectorAll(".cell-container");
            let isMouseDown = false;
            let startIndex = null;

            containers.forEach((container, idx) => {
                container.addEventListener("mousedown", function(e) {
                    isMouseDown = true;
                    startIndex = idx;
                    if (!e.ctrlKey && !e.shiftKey) { clearSelection(); }
                    selectCell(idx);
                });
                container.addEventListener("mouseenter", function() {
                    if (isMouseDown && startIndex !== null) {
                        clearSelection();
                        let min = Math.min(startIndex, idx);
                        let max = Math.max(startIndex, idx);
                        for (let i = min; i <= max; i++) { selectCell(i); }
                    }
                });
            });

            document.addEventListener("mouseup", function() { isMouseDown = false; });

            function selectCell(index) {
                containers[index].classList.add("tid-cell-selected");
                inputs[index].focus();
            }

            function clearSelection() {
                containers.forEach(c => c.classList.remove("tid-cell-selected"));
            }

            inputs.forEach(input => {
                input.addEventListener("click", function(e) {
                    let idx = parseInt(this.getAttribute("data-index"));
                    if (e.ctrlKey) { containers[idx].classList.toggle("tid-cell-selected"); }
                });

                input.addEventListener("keydown", function(e) {
                    let currentIndex = parseInt(this.getAttribute("data-index"));
                    if (e.key === "Enter" || e.key === "ArrowDown") {
                        e.preventDefault();
                        let nextIndex = currentIndex + 1;
                        if (nextIndex < inputs.length) { clearSelection(); selectCell(nextIndex); }
                    } else if (e.key === "ArrowUp") {
                        e.preventDefault();
                        let prevIndex = currentIndex - 1;
                        if (prevIndex >= 0) { clearSelection(); selectCell(prevIndex); }
                    }
                });

                input.addEventListener("paste", function(e) {
                    e.preventDefault();
                    let clipboardData = e.clipboardData || window.clipboardData;
                    let pastedData = clipboardData.getData("Text");
                    let lines = pastedData.split(/\r?\n/).map(l => l.trim()).filter(l => l);
                    let startIndex = parseInt(this.getAttribute("data-index"));
                    lines.forEach((line, idx) => {
                        let targetIdx = startIndex + idx;
                        if (targetIdx < inputs.length) { 
                            inputs[targetIdx].value = line; 
                        }
                    });
                    autoSaveDraft(inputs[0].closest('div').id); // trigger save
                });
            });
        }

        function preparePreview(dataDict) {
            previewPayload = [];
            for (let [tName, tids] of Object.entries(dataDict)) {
                if (!tids || tids.length === 0) continue;
                let memberName = batchTeamMembers[tName] ? ` - ${batchTeamMembers[tName]}` : "";
                let teamRows = [];
                tids.forEach((tid, i) => {
                    teamRows.push([
                        i + 1,
                        tid,
                        `ATM-${tid} (BEKASI)`,
                        `RPL-${tid}-99`,
                        `R-0${(i % 3) + 1}`,
                        `B-0${(i % 4) + 1}`,
                        `K-0${(i % 5) + 1}`,
                        "Ready"
                    ]);
                });
                previewPayload.push({ team_name: tName + memberName, data: teamRows });
            }

            currentSlideIndex = 0;
            renderSlideView();
        }

        function renderSlideView() {
            const content = document.getElementById("contentArea");
            let totalPages = previewPayload.length;
            if (totalPages === 0) return;

            let item = previewPayload[currentSlideIndex];

            let html = `
                <!-- Tombol Navigasi Slide & Aksi -->
                <div class="flex justify-between items-center mb-4 no-print bg-slate-100 p-2 rounded">
                    <button onclick="renderTeamMenuHtml()" class="bg-slate-500 hover:bg-slate-600 text-white text-xs font-bold px-3 py-1.5 rounded">⬅ Kembali ke Daftar Team</button>
                    
                    <div class="flex items-center gap-2">
                        <button onclick="prevSlide()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-1.5 rounded ${currentSlideIndex === 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${currentSlideIndex === 0 ? 'disabled' : ''}>◀ Sebelumnya</button>
                        <span class="text-xs font-bold text-slate-700">Slide ${currentSlideIndex + 1} dari ${totalPages}</span>
                        <button onclick="nextSlide()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-1.5 rounded ${currentSlideIndex === totalPages - 1 ? 'opacity-50 cursor-not-allowed' : ''}" ${currentSlideIndex === totalPages - 1 ? 'disabled' : ''}>Selanjutnya ▶</button>
                    </div>

                    <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-1.5 rounded">🖨️ CETAK DOKUMEN</button>
                </div>

                <!-- Tampilan Dokumen per Slide -->
                <div class="border border-slate-400 bg-white p-2">
                    <table class="w-full border-collapse text-xs">
                        <thead>
                            <tr>
                                <th colspan="3" class="bg-amber-500 text-white border border-slate-400 p-2 text-left font-bold text-sm">${item.team_name}</th>
                                <th colspan="4" class="bg-amber-500 text-white border border-slate-400 p-2 text-center font-bold text-sm">NAMA TEAM</th>
                                <th class="bg-amber-500 text-white border border-slate-400 p-2"></th>
                            </tr>
                            <tr class="bg-blue-900 text-white">
                                <th class="border border-slate-400 p-1 w-10">NO</th>
                                <th class="border border-slate-400 p-1 w-20">TID</th>
                                <th class="border border-slate-400 p-1 text-left px-2">LOKASI</th>
                                <th class="border border-slate-400 p-1">BARCODE RPL</th>
                                <th class="border border-slate-400 p-1 w-12">RAK</th>
                                <th class="border border-slate-400 p-1 w-12">BARIS</th>
                                <th class="border border-slate-400 p-1 w-12">KOLOM</th>
                                <th class="border border-slate-400 p-1 w-24">KETERANGAN</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            item.data.forEach((row, rIdx) => {
                let bg = rIdx % 2 === 0 ? "bg-slate-50" : "bg-white";
                html += `
                    <tr class="${bg}">
                        <td class="border border-slate-400 p-1 text-center">${row[0]}</td>
                        <td class="border border-slate-400 p-1 text-center font-bold">${row[1]}</td>
                        <td class="border border-slate-400 p-1 px-2">${row[2]}</td>
                        <td class="border border-slate-400 p-1 text-center font-mono">${row[3]}</td>
                        <td class="border border-slate-400 p-1 text-center">${row[4]}</td>
                        <td class="border border-slate-400 p-1 text-center">${row[5]}</td>
                        <td class="border border-slate-400 p-1 text-center">${row[6]}</td>
                        <td class="border border-slate-400 p-1 text-center text-emerald-600 font-bold">${row[7]}</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            content.innerHTML = html;
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderSlideView();
            }
        }

        function nextSlide() {
            if (currentSlideIndex < previewPayload.length - 1) {
                currentSlideIndex++;
                renderSlideView();
            }
        }
    </script>
</body>
</html>
