<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWCRO_PHP_V7 (WEB VERSION)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-[#0f172a] text-white p-4 shadow-md flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="text-2xl font-bold text-amber-400">∞ bgi</span>
            <span class="text-sm tracking-wider text-gray-300 border-l pl-3 border-gray-600">Integrated Cash Solutions</span>
        </div>
        <div class="text-sm font-semibold text-gray-300">
            PT. Bringin Gigantara
        </div>
    </header>

    <!-- Sub Header Title -->
    <div class="bg-slate-200 py-2 px-6 text-slate-700 font-semibold text-sm tracking-wide shadow-inner border-b border-slate-300">
        NEWCRO_PHP_V7 (WEB VERSION)
    </div>

    <!-- Main Content Area (Login Form Box) -->
    <div class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-lg shadow-sm border border-slate-300 w-full max-w-md">
            
            <div class="bg-slate-900 text-white p-4 rounded-md text-center mb-6 shadow-inner">
                <h2 class="font-bold text-sm tracking-wider">PT. Bringin Gigantara</h2>
                <p class="text-xs text-amber-400 mt-1">BG BEKASI</p>
            </div>

            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Masukan Username/ Password :</label>
                    <input type="password" name="password" required class="w-full border border-slate-300 rounded px-2.5 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-slate-800 text-center tracking-widest" placeholder="---">
                </div>
                <button type="submit" class="w-full bg-[#1e3a8a] hover:bg-blue-900 text-white font-bold py-2.5 rounded text-sm shadow transition">
                    LOGIN
                </button>
            </form>
        </div>
    </div>

</body>
