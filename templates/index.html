<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT. Bringin Gigantara - Management Kunci</title>
    <!-- Tailwind CSS untuk styling modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .page-break { page-break-after: always; break-after: page; }
        }
        /* Efek sel aktif ala Excel */
        .tid-cell-selected {
            background-color: #FEF08A !important; /* Kuning cerah */
            outline: 2px solid #2563EB !important; /* Border biru tebal */
            z-index: 10;
            position: relative;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#1E293B] via-[#334155] to-[#0F172A] font-sans antialiased min-h-screen flex flex-col">

    <!-- LAYAR LOGIN -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white/95 backdrop-blur p-8 rounded-xl shadow-2xl border border-white/20 w-[380px] text-center">
            <h2 class="text-xl font-extrabold text-[#1E3A8A] tracking-wide">PT. Bringin Gigantara</h2>
            <p class="text-xs italic text-slate-500 mb-6">Integrated Cash Solutions</p>
            
            <label class="block text-left text-sm font-semibold text-slate-700 mb-2">Masukkan Password Akses:</label>
            <input type="password" id="loginPass" class="w-full text-center text-lg border border-slate-300 rounded-lg p-2.5 mb-4 shadow-inner focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200 transition" placeholder="••••" autofocus onkeypress="if(event.key === 'Enter') handleLogin()">
            
            <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-blue-700 to-indigo-800 hover:from-blue-800 hover:to-indigo-900 text-white font-bold py-2.5 rounded-lg shadow-md transition transform active:scale-[0.98]">LOGIN</button>
        </div>
    </div>

    <!-- APLIKASI UTAMA -->
    <div id="mainApp" class="hidden flex flex-col flex-1">
        <!-- Header dengan Efek 3D / Gradasi Elegan & Teks Berjalan -->
        <header class="bg-gradient-to-r from-[#0F172A] via-[#1E3A8A] to-[#1E293B] h-20 flex items-center justify-between px-6 text-white shadow-xl border-b border-blue-900/50 overflow-hidden">
            <div class="flex items-center space-x-3 z-10 bg-[#0F172A] pr-4">
                <span class="text-3xl font-extrabold text-[#F97316] drop-shadow-[0_2px_2px_rgba(0,0,0,0.5)]">∞ bgi</span>
                <span class="text-xs text-slate-300 leading-tight font-medium">Integrated<br>Cash Solutions</span>
            </div>
            <!-- Teks Berjalan (Marquee) -->
            <div class="flex-1 overflow-hidden mx-6">
                <marquee scrollamount="5" class="text-xl font-bold tracking-wider drop-shadow text-amber-300">
                    9930 BG BEKASI
                </marquee>
            </div>
        </header>

        <!-- Sub-bar Version -->
        <div class="bg-gradient-to-r from-[#CBD5E1] to-[#94A3B8] px-6 py-1.5 text-xs font-bold text-[#1E293B] pl-[170px] shadow-inner border-b border-slate-400">
            NEWCRO_PHP_V7 (WEB VERSION)
        </div>

        <!-- Body Content -->
        <div class="flex flex-1 p-3 gap-3">
            <!-- Sidebar -->
            <aside class="w-[200px] flex flex-col gap-3">
                <div class="bg-gradient-to-b from-[#DBEAFE] to-[#BFDBFE] border border-blue-300 p-3.5 rounded-xl shadow-lg">
                    <div id="sidebarRole" class="font-extrabold text-[#1E3A8A] text-center mb-2 tracking-wide text-xs">TEKNISI<br>BG BEKASI</div>
                    <div class="space-y-1.5 font-mono text-[11px] text-slate-800 border-t border-blue-200/60 pt-2">
                        <div>USER ID : <span id="lblUserId" class="font-bold">---</span></div>
                        <div>NAMA : <span id="lblUserName" class="font-bold">---</span></div>
                        <div>DATE : <span id="lblDate" class="font-bold">---</span></div>
                        <div>LOGIN : <span id="lblLoginTime" class="font-bold">---</span></div>
                    </div>
                </div>

                <button onclick="renderTeamMenuHtml()" class="text-left bg-gradient-to-r from-blue-100 to-indigo-100 hover:from-blue-200 hover:to-indigo-200 text-[#1E3A8A] font-bold py-2.5 px-3 rounded-lg text-xs shadow transition border border-blue-200">
                    🌺 CETAK KUNCI RPL
                </button>
                <button onclick="location.reload()" class="text-left bg-gradient-to-r from-red-100 to-rose-100 hover:from-red-200 hover:to-rose-200 text-[#991B1B] font-bold py-2.5 px-3 rounded-lg text-xs shadow transition border border-red-200">
                    🚨 Logout
                </button>
            </aside>

            <!-- Main Dynamic Content Area -->
            <main id="contentArea" class="flex-1 bg-white/95 backdrop-blur-md p-5 rounded-xl shadow-2xl border border-slate-200 overflow-y-auto">
                <div class="flex items-center justify-center h-full text-slate-400 italic">
                    Silakan klik tombol 'CETAK KUNCI RPL' di menu sebelah kiri.
                </div>
            </main>
        </div>
    </div>

    <script>
        let currentUser = null;
        let batchTeamsData = {}; 
        let batchTeamMembers = {}; 
        let previewPayload = [];
        let currentSlideIndex = 0;

        const teamsList = [
            "TEAM RPL MALAM 1", "TEAM RPL MALAM 2", "*",
            "TEAM RPL PAGI 1", "TEAM RPL PAGI 2", "TEAM RPL PAGI 3", "TEAM RPL PAGI 4", "TEAM RPL PAGI 5", "TEAM RPL PAGI 6", "TEAM RPL PAGI 7", "TEAM RPL PAGI 8", "TEAM RPL PAGI 9", "*",
            "TEAM RPL MIDLE 1", "TEAM RPL MIDLE 2", "TEAM RPL MIDLE 3", "*",
            "TEAM RPL SIANG 1", "TEAM RPL SIANG 2", "TEAM RPL SIANG 3", "TEAM RPL SIANG 4"
        ];

        async function handleLogin() {
            const pwd = document.getElementById("loginPass").value.trim();
            const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password: pwd })
            });
            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                document.getElementById("loginScreen").classList.add("hidden");
                document.getElementById("mainApp").classList.remove("hidden");
                
                document.getElementById("sidebarRole").innerHTML = `${currentUser.role}<br>BG BEKASI`;
                document.getElementById("lblUserId").innerText = currentUser.id;
                document.getElementById("lblUserName").innerText = currentUser.name;
                document.getElementById("lblDate").innerText = currentUser.today_date;
                document.getElementById("lblLoginTime").innerText = currentUser.login_time;

                renderTeamMenuHtml();
            } else {
                alert(data.message);
            }
        }

        function renderTeamMenuHtml() {
            const content = document.getElementById("contentArea");
            let hasData = Object.values(batchTeamsData).some(tids => tids && tids.length > 0);

            let html = `
                <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-200">
                    <span class="font-bold text-slate-800 text-base">Pilih Team RPL</span>
                    ${hasData ? `<button onclick="preparePreview(batchTeamsData)" class="bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-700 hover:to-teal-800 text-white text-xs font-bold px-3.5 py-2 rounded-lg shadow transition">🖨️ Pratinjau / Cetak Semua Team</button>` : ''}
                </div>
                <div class="grid grid-cols-1 gap-2 max-w-md">
            `;

            teamsList.forEach(team => {
                if (team === "*") {
                    html += `<div class="bg-slate-100 text-center text-slate-400 font-bold text-xs py-1.5 rounded border border-slate-200">*</div>`;
                } else {
                    let isFilled = batchTeamsData[team] && batchTeamsData[team].length > 0;
                    let btnText = isFilled ? `✓ ${team} (${batchTeamsData[team].length} TID)` : team;
                    let btnBg = isFilled ? "bg-gradient-to-r from-emerald-50 to-teal-50 text-emerald-900 border-emerald-300 shadow-sm" : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50 shadow-sm";
                    
                    html += `<button onclick="openTeamInput('${team}')" class="text-left border px-4 py-2.5 rounded-lg text-sm font-bold transition transform active:scale-[0.99] ${btnBg}">${btnText}</button>`;
                }
            });

            html += `</div>`;
            content.innerHTML = html;
        }

        function openTeamInput(teamName) {
            const content = document.getElementById("contentArea");
            
            let previousTids = [];
            let activeInputs = document.querySelectorAll(".tid-input");
            if (activeInputs.length > 0) {
                activeInputs.forEach(inp => previousTids.push(inp.value.trim()));
            } else {
                previousTids = batchTeamsData[teamName] || [];
            }

            let memberElem = document.getElementById("inputTeamMember");
            let previousMemberName = memberElem ? memberElem.value : (batchTeamMembers[teamName] || "");

            let html = `
                <!-- Baris Tombol Aksi di Atas Sejajar dengan Tombol Kembali -->
                <div class="flex flex-wrap justify-between items-center mb-4 gap-2 bg-slate-100 p-2.5 rounded-lg shadow-sm border border-slate-200">
                    <div class="flex items-center gap-2">
                        <button onclick="saveAndReturnMenu('${teamName}')" class="bg-gradient-to-r from-slate-600 to-slate-700 hover:from-slate-700 hover:to-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow">⬅ Kembali ke Daftar Team</button>
                        <span class="text-xs text-slate-700 font-bold ml-2">INPUT TID - ${teamName}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="saveTeamAndPrint('${teamName}')" class="bg-gradient-to-r from-sky-600 to-blue-700 hover:from-sky-700 hover:to-blue-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow">🖨️ Cetak</button>
                        <button onclick="saveAndReturnMenu('${teamName}')" class="bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow">💾 Simpan</button>
                        <button onclick="clearAllTids('${teamName}')" class="bg-gradient-to-r from-red-600 to-rose-700 hover:from-red-700 hover:to-rose-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow">🗑️ Hapus Semua TID</button>
                    </div>
                </div>

                <!-- Layout 2 Kolom Sejajar Atas -->
                <div class="flex flex-wrap gap-6 items-start">
                    <!-- Kolom Kiri: Tabel Input -->
                    <div class="flex flex-col gap-3">
                        <div class="border border-slate-400 rounded-lg overflow-hidden bg-white shadow-md">
                            <table class="border-collapse text-sm w-full">
                                <thead>
                                    <!-- Baris Header Dummy untuk Menyamakan Tinggi dengan Judul Tabel Kanan -->
                                    <tr>
                                        <th colspan="2" class="bg-transparent border-0 p-[11.5px] text-left select-none opacity-0 pointer-events-none">
                                            Spacer
                                        </th>
                                    </tr>
                                    <tr>
                                        <th colspan="2" class="bg-gradient-to-r from-amber-500 to-orange-500 border border-slate-400 p-1.5 text-left shadow-inner">
                                            <input type="text" id="inputTeamMember" value="${previousMemberName}" placeholder="TEAM" class="w-full bg-transparent text-slate-900 font-extrabold placeholder-slate-800 px-1 py-0.5 border-none outline-none text-sm uppercase text-center drop-shadow-sm" oninput="autoSaveDraft('${teamName}')">
                                        </th>
                                    </tr>
                                    <tr class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white">
                                        <th class="border border-slate-400 p-1.5 w-10 text-center font-bold text-xs shadow-inner">NO</th>
                                        <th class="border border-slate-400 p-1.5 px-2 font-bold text-center w-24 text-xs shadow-inner">TID</th>
                                    </tr>
                                </thead>
                                <tbody id="tidTableBody">
            `;

            for (let i = 0; i < 16; i++) {
                let val = previousTids[i] || "";
                html += `
                    <tr>
                        <td class="border border-slate-400 p-1 text-center font-bold text-slate-700 text-xs bg-slate-100/60">${i + 1}</td>
                        <td class="border border-slate-400 p-0.5 cell-container" data-index="${i}">
                            <input type="text" maxlength="15" class="tid-input w-full px-1 py-0.5 border-none text-sm text-center outline-none bg-transparent" value="${val}" data-index="${i}" oninput="handleTidInput('${teamName}')">
                        </td>
                    </tr>
                `;
            }

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Kolom Kanan: Real-Time Preview Table -->
                    <div class="flex-1 border border-slate-300 bg-white p-3.5 rounded-xl shadow-lg overflow-x-auto min-w-[500px]">
                        <div class="text-xs font-extrabold text-slate-700 mb-2 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> PRATINJAU REAL-TIME:
                        </div>
                        <table class="w-full border-collapse text-xs shadow-sm rounded-lg overflow-hidden">
                            <thead>
                                <tr>
                                    <th colspan="10" class="bg-gradient-to-r from-slate-200 via-slate-300 to-slate-200 text-slate-900 border-2 border-slate-400 p-2 text-left font-extrabold text-sm shadow-sm" id="previewTeamTitle">${teamName}${previousMemberName ? ' - ' + previousMemberName : ''}</th>
                                </tr>
                                <tr class="bg-gradient-to-r from-slate-400 via-slate-500 to-slate-400 text-white font-bold shadow-inner">
                                    <th class="border border-slate-500 p-1.5 w-10 shadow-sm">NO</th>
                                    <th class="border border-slate-500 p-1.5 w-20 shadow-sm">TID</th>
                                    <th class="border border-slate-500 p-1.5 px-3 text-center whitespace-nowrap shadow-sm">LOKASI</th>
                                    <th class="border border-slate-500 p-1.5 px-1 text-center w-[100px] truncate shadow-sm">BARCODE RPL</th>
                                    <th class="border border-slate-500 p-1.5 px-1 text-center w-[100px] truncate shadow-sm">BARCODE FLM</th>
                                    <th class="border border-slate-500 p-1.5 w-12 shadow-sm">RAK</th>
                                    <th class="border border-slate-500 p-1.5 w-12 shadow-sm">BARIS</th>
                                    <th class="border border-slate-500 p-1.5 w-12 shadow-sm">KOLOM</th>
                                    <th class="border border-slate-500 p-1.5 w-20 shadow-sm">KETERANGAN</th>
                                    <th class="border border-slate-500 p-1.5 w-20 shadow-sm"></th>
                                </tr>
                            </thead>
                            <tbody id="realtimePreviewBody">
            `;

            for (let i = 0; i < 16; i++) {
                let tid = previousTids[i] || "";
                let bg = i % 2 === 0 ? "bg-slate-50/80" : "bg-white";
                if (tid) {
                    html += `
                        <tr class="${bg}" id="preview-row-${i}">
                            <td class="border border-slate-300 p-1 text-center">${i + 1}</td>
                            <td class="border border-slate-300 p-1 text-center font-bold text-blue-900">${tid}</td>
                            <td class="border border-slate-300 p-1 px-3 text-center whitespace-nowrap">ATM-${tid} (BEKASI)</td>
                            <td class="border border-slate-300 p-1 px-1 text-center font-mono truncate max-w-[100px]">RPL-${tid}-99</td>
                            <td class="border border-slate-300 p-1 px-1 text-center font-mono truncate max-w-[100px]">FLM-${tid}-88</td>
                            <td class="border border-slate-300 p-1 text-center">R-0${(i % 3) + 1}</td>
                            <td class="border border-slate-300 p-1 text-center">B-0${(i % 4) + 1}</td>
                            <td class="border border-slate-300 p-1 text-center">K-0${(i % 5) + 1}</td>
                            <td class="border border-slate-300 p-1 text-center"></td>
                            <td class="border border-slate-300 p-1 text-center"></td>
                        </tr>
                    `;
                } else {
                    html += `
                        <tr class="${bg}" id="preview-row-${i}" style="display: none;">
                            <td class="border border-slate-300 p-1 text-center">${i + 1}</td>
                            <td class="border border-slate-300 p-1 text-center font-bold text-blue-900"></td>
                            <td class="border border-slate-300 p-1 px-3 text-center whitespace-nowrap"></td>
                            <td class="border border-slate-300 p-1 px-1 text-center font-mono truncate max-w-[100px]"></td>
                            <td class="border border-slate-300 p-1 px-1 text-center font-mono truncate max-w-[100px]"></td>
                            <td class="border border-slate-300 p-1 text-center"></td>
                            <td class="border border-slate-300 p-1 text-center"></td>
                            <td class="border border-slate-300 p-1 text-center"></td>
                            <td class="border border-slate-300 p-1 text-center"></td>
                            <td class="border border-slate-300 p-1 text-center"></td>
                        </tr>
                    `;
                }
            }

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            content.innerHTML = html;
            setupExcelInteractions(teamName);
        }

        function handleTidInput(teamName) {
            autoSaveDraft(teamName);
            updateRealtimePreview();
        }

        function updateRealtimePreview() {
            let memberName = document.getElementById("inputTeamMember") ? document.getElementById("inputTeamMember").value.trim() : "";
            let headerTextElem = document.querySelector(".flex.flex-wrap.justify-between.items-center.mb-4 span.text-xs.text-slate-700.font-bold");
            let baseTeamName = "";
            if (headerTextElem) {
                baseTeamName = headerTextElem.innerText.replace("INPUT TID - ", "").trim();
            }
            
            let titleElem = document.getElementById("previewTeamTitle");
            if (titleElem && baseTeamName) {
                titleElem.innerText = baseTeamName + (memberName ? ` - ${memberName}` : "");
            }

            let inputs = document.querySelectorAll(".tid-input");
            inputs.forEach((inp, i) => {
                let tid = inp.value.trim();
                let row = document.getElementById(`preview-row-${i}`);
                if (row) {
                    if (tid !== "") {
                        row.style.display = "";
                        row.cells[1].innerText = tid;
                        row.cells[2].innerText = `ATM-${tid} (BEKASI)`;
                        row.cells[3].innerText = `RPL-${tid}-99`;
                        row.cells[4].innerText = `FLM-${tid}-88`;
                        row.cells[5].innerText = `R-0${(i % 3) + 1}`;
                        row.cells[6].innerText = `B-0${(i % 4) + 1}`;
                        row.cells[7].innerText = `K-0${(i % 5) + 1}`;
                        row.cells[8].innerText = "";
                        row.cells[9].innerText = "";
                    } else {
                        row.style.display = "none";
                    }
                }
            });
        }

        function clearAllTids(teamName) {
            if (confirm("Apakah Anda yakin ingin menghapus semua TID yang terisi di tabel ini?")) {
                const inputs = document.querySelectorAll(".tid-input");
                inputs.forEach(inp => inp.value = "");
                batchTeamsData[teamName] = [];
                updateRealtimePreview();
            }
        }

        function autoSaveDraft(teamName) {
            let memberName = document.getElementById("inputTeamMember") ? document.getElementById("inputTeamMember").value.trim() : "";
            let inputs = document.querySelectorAll(".tid-input");
            let tids = [];
            inputs.forEach(inp => {
                if(inp.value.trim() !== "") tids.push(inp.value.trim());
            });

            batchTeamsData[teamName] = tids;
            if(memberName) batchTeamMembers[teamName] = memberName;
        }

        function saveAndReturnMenu(teamName) {
            autoSaveDraft(teamName);
            renderTeamMenuHtml();
        }

        function saveTeamAndPrint(teamName) {
            autoSaveDraft(teamName);
            let tids = batchTeamsData[teamName] || [];
            if (tids.length === 0) {
                alert("Harap masukkan minimal 1 TID!");
                return;
            }
            let singleData = {};
            singleData[teamName] = tids;
            preparePreview(singleData);
        }

        function setupExcelInteractions(teamName) {
            const inputs = document.querySelectorAll(".tid-input");
            const containers = document.querySelectorAll(".cell-container");
            let isMouseDown = false;
            let startIndex = null;

            containers.forEach((container, idx) => {
                container.addEventListener("mousedown", function(e) {
                    if (e.ctrlKey) {
                        e.preventDefault();
                        container.classList.toggle("tid-cell-selected");
                        return;
                    }

                    isMouseDown = true;
                    startIndex = idx;
                    if (!e.shiftKey) { clearSelection(); }
                    selectCell(idx);
                });

                container.addEventListener("mouseenter", function() {
                    if (isMouseDown && startIndex !== null) {
                        clearSelection();
                        let min = Math.min(startIndex, idx);
                        let max = Math.max(startIndex, idx);
                        for (let i = min; i <= max; i++) { selectCell(i); }
                    }
                });
            });

            document.addEventListener("mouseup", function() { isMouseDown = false; });

            function selectCell(index) {
                containers[index].classList.add("tid-cell-selected");
            }

            function clearSelection() {
                containers.forEach(c => c.classList.remove("tid-cell-selected"));
            }

            inputs.forEach(input => {
                input.addEventListener("mousedown", function(e) {
                    let idx = parseInt(this.getAttribute("data-index"));
                    if (e.ctrlKey) {
                        e.preventDefault();
                        containers[idx].classList.toggle("tid-cell-selected");
                        if(containers[idx].classList.contains("tid-cell-selected")) {
                            this.focus();
                        }
                    }
                });

                input.addEventListener("keydown", function(e) {
                    let currentIndex = parseInt(this.getAttribute("data-index"));

                    if (e.ctrlKey && e.key.toLowerCase() === 'a') {
                        e.preventDefault();
                        containers.forEach(c => c.classList.add("tid-cell-selected"));
                        return;
                    }

                    if (e.key === "Delete" || e.key === "Backspace") {
                        let selectedContainers = document.querySelectorAll(".tid-cell-selected");
                        if (selectedContainers.length > 0) {
                            e.preventDefault();
                            selectedContainers.forEach(cont => {
                                let inp = cont.querySelector(".tid-input");
                                if (inp) inp.value = "";
                            });
                            autoSaveDraft(teamName);
                            updateRealtimePreview();
                        }
                    } else if (e.key === "Enter" || e.key === "ArrowDown") {
                        e.preventDefault();
                        let nextIndex = currentIndex + 1;
                        if (nextIndex < inputs.length) { 
                            clearSelection(); 
                            selectCell(nextIndex); 
                            inputs[nextIndex].focus();
                        }
                    } else if (e.key === "ArrowUp") {
                        e.preventDefault();
                        let prevIndex = currentIndex - 1;
                        if (prevIndex >= 0) { 
                            clearSelection(); 
                            selectCell(prevIndex); 
                            inputs[prevIndex].focus();
                        }
                    }
                });

                input.addEventListener("copy", function(e) {
                    let selectedContainers = document.querySelectorAll(".tid-cell-selected");
                    if (selectedContainers.length > 1) {
                        e.preventDefault();
                        let copiedValues = [];
                        selectedContainers.forEach(cont => {
                            let inp = cont.querySelector(".tid-input");
                            if (inp) copiedValues.push(inp.value);
                        });
                        let textToCopy = copiedValues.join("\n");
                        e.clipboardData.setData("text/plain", textToCopy);
                    }
                });

                input.addEventListener("paste", function(e) {
                    e.preventDefault();
                    let clipboardData = e.clipboardData || window.clipboardData;
                    let pastedData = clipboardData.getData("Text");
                    let lines = pastedData.split(/\r?\n/).map(l => l.trim()).filter(l => l);
                    let startIndex = parseInt(this.getAttribute("data-index"));
                    lines.forEach((line, idx) => {
                        let targetIdx = startIndex + idx;
                        if (targetIdx < inputs.length) { 
                            inputs[targetIdx].value = line; 
                        }
                    });
                    autoSaveDraft(teamName);
                    updateRealtimePreview();
                });
            });
        }

        function preparePreview(dataDict) {
            previewPayload = [];
            for (let [tName, tids] of Object.entries(dataDict)) {
                if (!tids || tids.length === 0) continue;
                let memberName = batchTeamMembers[tName] ? ` - ${batchTeamMembers[tName]}` : "";
                let teamRows = [];
                tids.forEach((tid, i) => {
                    teamRows.push([
                        i + 1,
                        tid,
                        `ATM-${tid} (BEKASI)`,
                        `RPL-${tid}-99`,
                        `FLM-${tid}-88`,
                        `R-0${(i % 3) + 1}`,
                        `B-0${(i % 4) + 1}`,
                        `K-0${(i % 5) + 1}`,
                        "",
                        ""
                    ]);
                });
                previewPayload.push({ team_name: tName + memberName, data: teamRows });
            }

            currentSlideIndex = 0;
            renderSlideView();
        }

        function renderSlideView() {
            const content = document.getElementById("contentArea");
            let totalPages = previewPayload.length;
            if (totalPages === 0) return;

            let item = previewPayload[currentSlideIndex];

            let html = `
                <div class="flex justify-between items-center mb-4 no-print bg-slate-100 p-2.5 rounded-lg shadow-sm border border-slate-200">
                    <button onclick="renderTeamMenuHtml()" class="bg-gradient-to-r from-slate-600 to-slate-700 hover:from-slate-700 hover:to-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow">⬅ Kembali ke Daftar Team</button>
                    
                    <div class="flex items-center gap-2">
                        <button onclick="prevSlide()" class="bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow ${currentSlideIndex === 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${currentSlideIndex === 0 ? 'disabled' : ''}>◀ Sebelumnya</button>
                        <span class="text-xs font-bold text-slate-700">Slide ${currentSlideIndex + 1} dari ${totalPages}</span>
                        <button onclick="nextSlide()" class="bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow ${currentSlideIndex === totalPages - 1 ? 'opacity-50 cursor-not-allowed' : ''}" ${currentSlideIndex === totalPages - 1 ? 'disabled' : ''}>Selanjutnya ▶</button>
                    </div>

                    <button onclick="window.print()" class="bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-700 hover:to-teal-800 text-white text-xs font-bold px-4 py-1.5 rounded shadow">🖨️ CETAK DOKUMEN</button>
                </div>

                <div class="border border-slate-300 bg-white p-3 rounded-xl shadow-md">
                    <table class="w-full border-collapse text-xs rounded-lg overflow-hidden shadow-sm">
                        <thead>
                            <tr>
                                <th colspan="10" class="bg-gradient-to-r from-slate-200 via-slate-300 to-slate-200 text-slate-900 border-2 border-slate-400 p-2.5 text-left font-extrabold text-sm shadow-sm">${item.team_name}</th>
                            </tr>
                            <tr class="bg-gradient-to-r from-slate-400 via-slate-500 to-slate-400 text-white font-bold shadow-inner">
                                <th class="border border-slate-500 p-1.5 w-10 font-bold shadow-sm">NO</th>
                                <th class="border border-slate-500 p-1.5 w-20 font-bold shadow-sm">TID</th>
                                <th class="border border-slate-500 p-1.5 px-3 text-center whitespace-nowrap font-bold shadow-sm">LOKASI</th>
                                <th class="border border-slate-500 p-1.5 px-1 text-center w-[100px] truncate font-bold shadow-sm">BARCODE RPL</th>
                                <th class="border border-slate-500 p-1.5 px-1 text-center w-[100px] truncate font-bold shadow-sm">BARCODE FLM</th>
                                <th class="border border-slate-500 p-1.5 w-12 font-bold shadow-sm">RAK</th>
                                <th class="border border-slate-500 p-1.5 w-12 font-bold shadow-sm">BARIS</th>
                                <th class="border border-slate-500 p-1.5 w-12 font-bold shadow-sm">KOLOM</th>
                                <th class="border border-slate-500 p-1.5 w-20 font-bold shadow-sm">KETERANGAN</th>
                                <th class="border border-slate-500 p-1.5 w-20 font-bold shadow-sm"></th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            item.data.forEach((row, rIdx) => {
                let bg = rIdx % 2 === 0 ? "bg-slate-50/80" : "bg-white";
                html += `
                    <tr class="${bg}">
                        <td class="border border-slate-300 p-1 text-center">${row[0]}</td>
                        <td class="border border-slate-300 p-1 text-center font-bold text-blue-900">${row[1]}</td>
                        <td class="border border-slate-300 p-1 px-3 text-center whitespace-nowrap">${row[2]}</td>
                        <td class="border border-slate-300 p-1 px-1 text-center font-mono truncate max-w-[100px]">${row[3]}</td>
                        <td class="border border-slate-300 p-1 px-1 text-center font-mono truncate max-w-[100px]">${row[4]}</td>
                        <td class="border border-slate-300 p-1 text-center">${row[5]}</td>
                        <td class="border border-slate-300 p-1 text-center">${row[6]}</td>
                        <td class="border border-slate-300 p-1 text-center">${row[7]}</td>
                        <td class="border border-slate-300 p-1 text-center">${row[8]}</td>
                        <td class="border border-slate-300 p-1 text-center">${row[9]}</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            content.innerHTML = html;
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderSlideView();
            }
        }

        function nextSlide() {
            if (currentSlideIndex < previewPayload.length - 1) {
                currentSlideIndex++;
                renderSlideView();
            }
        }
    </script>
</body>
</html>
