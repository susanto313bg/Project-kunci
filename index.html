    <script>
        let currentUser = null;
        let batchTeamsData = {}; 
        let batchTeamMembers = {}; 
        let previewPayload = [];
        let currentSlideIndex = 0;
        let masterDatabase = {}; 
        let uploadedFilesArchive = {}; 

        function loadLocalStorageData() {
            try {
                const savedMaster = localStorage.getItem("bgi_masterDatabase");
                if (savedMaster) masterDatabase = JSON.parse(savedMaster);

                const savedTeams = localStorage.getItem("bgi_batchTeamsData");
                if (savedTeams) batchTeamsData = JSON.parse(savedTeams);

                const savedMembers = localStorage.getItem("bgi_batchTeamMembers");
                if (savedMembers) batchTeamMembers = JSON.parse(savedMembers);

                const savedFiles = localStorage.getItem("bgi_uploadedFilesArchive");
                if (savedFiles) uploadedFilesArchive = JSON.parse(savedFiles);
            } catch (e) {
                console.error("Gagal memuat local storage:", e);
            }
        }

        function saveLocalStorageData() {
            try {
                localStorage.setItem("bgi_masterDatabase", JSON.stringify(masterDatabase));
                localStorage.setItem("bgi_batchTeamsData", JSON.stringify(batchTeamsData));
                localStorage.setItem("bgi_batchTeamMembers", JSON.stringify(batchTeamMembers));
                localStorage.setItem("bgi_uploadedFilesArchive", JSON.stringify(uploadedFilesArchive));
            } catch (e) {
                console.error("Gagal menyimpan local storage:", e);
            }
        }

        // FUNGSI UTAMA: Download/Backup Master Data ke format Excel (.xlsx)
        function downloadMasterExcelBackup() {
            try {
                let keys = Object.keys(masterDatabase);
                if (keys.length === 0) {
                    alert("Tidak ada data master yang dapat diunduh (Data masih kosong).");
                    return;
                }

                // Ubah format masterDatabase menjadi array objek standar Excel
                let excelRows = keys.map((tid, index) => {
                    let item = masterDatabase[tid];
                    return {
                        "NO": index + 1,
                        "TID": tid,
                        "LOKASI ATM": item.lokasi || "",
                        "BARCODE RPL": item.rpl || "",
                        "BARCODE FLM": item.flm || "",
                        "RAK": item.rak || "",
                        "BARIS": item.baris || "",
                        "KOLOM": item.kolom || ""
                    };
                });

                // Buat Worksheet & Workbook menggunakan SheetJS
                let worksheet = XLSX.utils.json_to_sheet(excelRows);
                let workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Master Data Kunci");

                // Ekspor file dengan nama dan tanggal otomatis
                let fileName = `BG_BEKASI_MASTER_DATA_${new Date().toISOString().slice(0,10)}.xlsx`;
                XLSX.writeFile(workbook, fileName);
                
                alert("File Backup Master Data (.xlsx) berhasil diunduh!");
            } catch (e) {
                console.error(e);
                alert("Gagal mengunduh file Excel master data.");
            }
        }

        function restoreSystemBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.masterDatabase) masterDatabase = parsed.masterDatabase;
                    if (parsed.batchTeamsData) batchTeamsData = parsed.batchTeamsData;
                    if (parsed.batchTeamMembers) batchTeamMembers = parsed.batchTeamMembers;
                    if (parsed.uploadedFilesArchive) uploadedFilesArchive = parsed.uploadedFilesArchive;

                    saveLocalStorageData();
                    alert("Data Master & Sistem berhasil dipulihkan (Restore) dengan sukses!");
                    location.reload();
                } catch (err) {
                    alert("File backup sistem tidak valid.");
                }
            };
            reader.readAsText(file);
        }

        loadLocalStorageData();

        const teamGroups = {
            "PAGI": ["TEAM RPL PAGI 1", "TEAM RPL PAGI 2", "TEAM RPL PAGI 3", "TEAM RPL PAGI 4", "TEAM RPL PAGI 5", "TEAM RPL PAGI 6", "TEAM RPL PAGI 7", "TEAM RPL PAGI 8", "TEAM RPL PAGI 9"],

        function checkSidebarTid() {
            let tidInput = document.getElementById("sidebarInputTid").value.trim();
            let detailBox = document.getElementById("sidebarTidDetail");
            let confirmBox = document.getElementById("sidebarConfirmBox");
            let submitBtn = document.getElementById("sideBtnSubmit");

            if (tidInput && masterDatabase[tidInput]) {
                let item = masterDatabase[tidInput];
                document.getElementById("sideDetLokasi").innerText = item.lokasi;
                document.getElementById("sideDetRpl").innerText = item.rpl;
                document.getElementById("sideDetFlm").innerText = item.flm;

                detailBox.classList.remove("hidden");
                confirmBox.classList.remove("hidden");
                submitBtn.classList.remove("hidden");
            } else {
                detailBox.classList.add("hidden");
                confirmBox.classList.add("hidden");
                submitBtn.classList.add("hidden");
            }
        }

        function resetSidebarDeleteForm() {
            document.getElementById("sidebarInputTid").value = "";
            checkSidebarTid();
        }

        function submitSidebarDeleteTid() {
            let tidInput = document.getElementById("sidebarInputTid").value.trim();
            let chk = document.getElementById("sideChkConfirm");

            if (!tidInput || !masterDatabase[tidInput] || !chk || !chk.checked) {
                alert("Periksa kembali nomor TID atau centang kotak konfirmasi!");
                return;
            }

            delete masterDatabase[tidInput];
            saveLocalStorageData();
            alert(`Data TID ${tidInput} berhasil dihapus.`);
            resetSidebarDeleteForm();
            if(document.getElementById("masterTableBody")) renderMasterTable();
        }

                            <h3 class="text-xs font-extrabold text-slate-700 mb-3 uppercase tracking-wider">➕ TAMBAH / UPDATE DATA MASTER TID</h3>
                            <div class="space-y-3 mb-4">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1">TID</label>
                                    <input type="text" id="m_tid" class="master-input w-full border border-slate-300 rounded p-1.5 text-xs bg-white font-bold text-blue-900" placeholder="Contoh: 12345678" data-index="0">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1">Lokasi ATM</label>
                                    <input type="text" id="m_lokasi" class="master-input w-full border border-slate-300 rounded p-1.5 text-xs bg-white" placeholder="Contoh: ATM-12345678 (BEKASI)" data-index="1">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1">Barcode RPL</label>
                                    <input type="text" id="m_rpl" class="master-input w-full border border-slate-300 rounded p-1.5 text-xs bg-white font-mono" placeholder="RPL-12345678-99" data-index="2">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1">Barcode FLM</label>
                                    <input type="text" id="m_flm" class="master-input w-full border border-slate-300 rounded p-1.5 text-xs bg-white font-mono" placeholder="FLM-12345678-88" data-index="3">
                                </div>
                                <div class="grid grid-cols-3 gap-2">
                                    <div>
                                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Rak</label>
                                        <input type="text" id="m_rak" class="master-input w-full border border-slate-300 rounded p-1.5 text-xs bg-white text-center" placeholder="R-01" data-index="4">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Baris</label>
                                        <input type="text" id="m_baris" class="master-input w-full border border-slate-300 rounded p-1.5 text-xs bg-white text-center" placeholder="B-01" data-index="5">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Kolom</label>
                                        <input type="text" id="m_kolom" class="master-input w-full border border-slate-300 rounded p-1.5 text-xs bg-white text-center" placeholder="K-01" data-index="6">
                                    </div>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="saveMasterItemManual()" class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white font-bold text-xs px-4 py-2 rounded shadow">Submit</button>
                                <button onclick="toggleMasterForm()" class="bg-gradient-to-r from-slate-400 to-slate-500 text-white font-bold text-xs px-4 py-2 rounded shadow">Batal</button>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white border border-slate-300 rounded-xl shadow-md p-4 overflow-x-auto w-full">
                        <div class="flex flex-wrap justify-between items-center mb-3 bg-blue-50 border border-blue-200 p-2.5 rounded-lg shadow-sm gap-2">
                            <span class="text-xs font-extrabold text-blue-900">📋 DATABASE MASTER AKTIF</span>
                            <div class="flex items-center gap-3">
                                <input type="text" id="masterSearchInput" onkeyup="renderMasterTable()" placeholder="🔍 Cari TID / Lokasi..." class="border border-slate-300 rounded-md px-3 py-1 text-xs bg-white font-medium text-slate-700 outline-none w-48 shadow-inner">
                                <div class="bg-amber-100 border border-amber-300 text-amber-900 px-3 py-1 rounded-md text-xs font-black">
                                    Total Aset: <span id="masterCountBadge" class="text-blue-700">0</span> TID
                                </div>
                            </div>
                        </div>
                        <table class="w-full border-collapse text-xs">
                            <thead>
                                <tr class="bg-slate-200 text-slate-800 font-bold">
                                    <th class="border border-slate-300 p-1.5 w-10">NO</th>
                                    <th class="border border-slate-300 p-1.5">TID</th>
                                    <th class="border border-slate-300 p-1.5">LOKASI ATM</th>
                                    <th class="border border-slate-300 p-1.5">BARCODE RPL</th>
                                    <th class="border border-slate-300 p-1.5">BARCODE FLM</th>
                                    <th class="border border-slate-300 p-1.5 w-12">RAK</th>
                                    <th class="border border-slate-300 p-1.5 w-12">BARIS</th>
                                    <th class="border border-slate-300 p-1.5 w-12">KOLOM</th>
                                </tr>
                            </thead>
                            <tbody id="masterTableBody">
                                <tr><td colspan="8" class="text-center p-4 text-slate-400 italic">Belum ada data master.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            renderMasterTable();
        }

        function toggleMasterForm() {
            const formContainer = document.getElementById("masterFormContainer");
            const btnText = document.getElementById("btnFormText");
            const btnIcon = document.getElementById("btnFormIcon");
            if (formContainer.classList.contains("hidden")) {
                formContainer.classList.remove("hidden");
                btnText.innerText = "Tutup Form";
                btnIcon.innerText = "✕";
            } else {
                formContainer.classList.add("hidden");
                btnText.innerText = "Tambah Data";
                btnIcon.innerText = "+";
            }
        }

        function handleEditDataClick() {
            let tidTarget = prompt("Masukkan nomor TID yang ingin diubah datanya:");
            if (!tidTarget) return;
            tidTarget = tidTarget.trim();
            if (!masterDatabase[tidTarget]) {
                alert("Nomor TID tidak ditemukan!");
                return;
            }
            let item = masterDatabase[tidTarget];
            if (document.getElementById("masterFormContainer").classList.contains("hidden")) toggleMasterForm();

            document.getElementById("m_tid").value = tidTarget;
            document.getElementById("m_tid").setAttribute("readonly", true);
            document.getElementById("m_lokasi").value = item.lokasi || "";
            document.getElementById("m_rpl").value = item.rpl || "";
            document.getElementById("m_flm").value = item.flm || "";
            document.getElementById("m_rak").value = item.rak || "";
            document.getElementById("m_baris").value = item.baris || "";
            document.getElementById("m_kolom").value = item.kolom || "";
        }

        function saveMasterItemManual() {
            let tid = document.getElementById("m_tid").value.trim();
            if (!tid) {
                alert("Nomor TID wajib diisi!");
                return;
            }
            masterDatabase[tid] = {
                lokasi: document.getElementById("m_lokasi").value.trim() || `ATM-${tid} (BEKASI)`,
                rpl: document.getElementById("m_rpl").value.trim() || `RPL-${tid}-99`,
                flm: document.getElementById("m_flm").value.trim() || "",
                rak: document.getElementById("m_rak").value.trim() || "",
                baris: document.getElementById("m_baris").value.trim() || "",
                kolom: document.getElementById("m_kolom").value.trim() || ""
            };
            saveLocalStorageData();
            renderMasterTable();
            toggleMasterForm();
            alert("Data master berhasil disimpan!");
        }

        function handleMasterUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                    
                    let count = 0;
                    jsonRows.forEach(row => {
                        let tid = String(row['TID'] || row['tid'] || '').trim();
                        if (!tid) return;

                        masterDatabase[tid] = {
                            lokasi: String(row['LOKASI ATM'] || row['Lokasi ATM'] || row['lokasi'] || `ATM-${tid} (BEKASI)`).trim(),
                            rpl: String(row['BARCODE RPL'] || row['Barcode RPL'] || row['rpl'] || `RPL-${tid}-99`).trim(),
                            flm: String(row['BARCODE FLM'] || row['Barcode FLM'] || row['flm'] || '').trim(),
                            rak: String(row['RAK'] || row['Rak'] || row['rak'] || '').trim(),
                            baris: String(row['BARIS'] || row['Baris'] || row['baris'] || '').trim(),
                            kolom: String(row['KOLOM'] || row['Kolom'] || row['kolom'] || '').trim()
                        };
                        count++;
                    });

                    uploadedFilesArchive[file.name] = {
                        upload_date: new Date().toISOString(),
                        total_rows: count
                    };

                    saveLocalStorageData();
                    renderMasterTable();
                    alert(`Berhasil mengimpor ${count} data master dari file Excel "${file.name}"!`);
                } catch (err) {
                    alert("Gagal membaca file Excel.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function renderMasterTable() {
            let tbody = document.getElementById("masterTableBody");
            let countBadge = document.getElementById("masterCountBadge");
            let keyword = document.getElementById("masterSearchInput") ? document.getElementById("masterSearchInput").value.toLowerCase().trim() : "";
            let keys = Object.keys(masterDatabase);
            
            if(countBadge) countBadge.innerText = keys.length;
            if (keys.length === 0) {
                if(tbody) tbody.innerHTML = `<tr><td colspan="8" class="text-center p-4 text-slate-400 italic">Belum ada data master.</td></tr>`;
                return;
            }

            let filteredKeys = keys.filter(tid => tid.toLowerCase().includes(keyword) || masterDatabase[tid].lokasi.toLowerCase().includes(keyword));
            let html = "";
            filteredKeys.forEach((tid, i) => {
                let item = masterDatabase[tid];
                html += `
                    <tr class="${i % 2 === 0 ? 'bg-slate-50' : 'bg-white'}">
                        <td class="border border-slate-300 p-1 text-center">${i + 1}</td>
                        <td class="border border-slate-300 p-1 text-center font-bold text-blue-900">${tid}</td>
                        <td class="border border-slate-300 p-1 px-2">${item.lokasi}</td>
                        <td class="border border-slate-300 p-1 px-2 font-mono">${item.rpl}</td>
                        <td class="border border-slate-300 p-1 px-2 font-mono">${item.flm}</td>
                        <td class="border border-slate-300 p-1 text-center">${item.rak}</td>
                        <td class="border border-slate-300 p-1 text-center">${item.baris}</td>
                        <td class="border border-slate-300 p-1 text-center">${item.kolom}</td>
                    </tr>
                `;
            });
            if(tbody) tbody.innerHTML = html;
        }

        function renderTeamMenuHtml() {
            const content = document.getElementById("contentArea");
            let hasData = Object.values(batchTeamsData).some(tids => tids && tids.length > 0);

            let html = `
                <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-200">
                    <div>
                        <span class="font-extrabold text-slate-800 text-base">🌺 CETAK KUNCI RPL - PILIH TEAM</span>
                        <p class="text-xs text-slate-500">Pilih team berdasarkan kelompok shift operasional</p>
                    </div>
                    ${hasData ? `<button onclick="preparePreview(batchTeamsData)" class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white text-xs font-bold px-4 py-2 rounded-lg shadow">🖨️ Pratinjau / Cetak Semua Team</button>` : ''}
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 pb-4">
            `;

            for (let [groupName, teams] of Object.entries(teamGroups)) {
                html += `
                    <div class="bg-slate-50 border rounded-2xl p-4 shadow-xl flex flex-col gap-3">
                        <div class="flex justify-between items-center pb-2 border-b font-black text-sm uppercase text-slate-800">
                            <span>SHIFT ${groupName}</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-200">${teams.length} Team</span>
                        </div>
                        <div class="grid grid-cols-1 gap-2">
                `;
                teams.forEach(team => {
                    let isFilled = batchTeamsData[team] && batchTeamsData[team].length > 0;
                    let count = isFilled ? batchTeamsData[team].length : 0;
                    html += `
                        <button onclick="openTeamInput('${team}')" class="text-left border px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex justify-between items-center ${isFilled ? 'bg-blue-600 text-white border-blue-500' : 'bg-white hover:bg-blue-50 text-slate-800 border-slate-300'}">
                            <span>${team}</span>
                            ${isFilled ? `<span class="text-[10px] bg-amber-400 text-slate-950 px-2 py-0.5 rounded-full font-extrabold">${count} TID</span>` : `<span class="text-[10px] opacity-60">Kosong</span>`}
                        </button>
                    `;
                });
                html += `</div></div>`;
            }
            html += `</div>`;
            content.innerHTML = html;
        }

        function openTeamInput(teamName) {
            const content = document.getElementById("contentArea");
            let previousTids = batchTeamsData[teamName] || [];
            let previousMemberName = batchTeamMembers[teamName] || "";

            content.innerHTML = `
                <div class="flex flex-wrap justify-between items-center mb-4 gap-2 bg-slate-100 p-2.5 rounded-lg border">
                    <button onclick="renderTeamMenuHtml()" class="bg-slate-700 text-white text-xs font-bold px-3 py-1.5 rounded">⬅ Kembali</button>
                    <div class="flex gap-2">
                        <button onclick="saveTeamAndPrint('${teamName}')" class="bg-sky-600 text-white text-xs font-bold px-3 py-1.5 rounded">🖨️ Cetak</button>
                        <button onclick="saveAndReturnMenu('${teamName}')" class="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded">💾 Simpan</button>
                    </div>
                </div>
                <div class="flex gap-6 items-start">
                    <div class="border rounded-lg bg-white shadow-md">
                        <table class="border-collapse text-sm w-full">
                            <thead>
                                <tr><th colspan="2" class="p-2"><input type="text" id="inputTeamMember" value="${previousMemberName}" placeholder="NAMA TEAM" class="w-full text-center font-bold text-xs uppercase border-b p-1" oninput="autoSaveDraft('${teamName}')"></th></tr>
                                <tr class="bg-emerald-600 text-white text-xs"><th class="border p-1.5 w-10">NO</th><th class="border p-1.5 w-24">TID</th></tr>
                            </thead>
                            <tbody>
            `;
            for (let i = 0; i < 16; i++) {
                html += `
                    <tr>
                        <td class="border p-1 text-center text-xs bg-slate-100">${i + 1}</td>
                        <td class="border p-0.5"><input type="text" maxlength="15" class="tid-input w-full px-1 py-0.5 text-center text-sm outline-none bg-transparent" value="${previousTids[i] || ''}" oninput="autoSaveDraft('${teamName}')"></td>
                    </tr>
                `;
            }
            html += `</tbody></table></div></div>`;
        }

        function autoSaveDraft(teamName) {
            let memberName = document.getElementById("inputTeamMember") ? document.getElementById("inputTeamMember").value.trim() : "";
            let tids = [];
            document.querySelectorAll(".tid-input").forEach(inp => { if(inp.value.trim() !== "") tids.push(inp.value.trim()); });

            batchTeamsData[teamName] = tids;
            if(memberName) batchTeamMembers[teamName] = memberName;
            saveLocalStorageData();
        }

        function saveAndReturnMenu(teamName) {
            autoSaveDraft(teamName);
            renderTeamMenuHtml();
        }

        function saveTeamAndPrint(teamName) {
            autoSaveDraft(teamName);
            alert("Data shift berhasil disimpan!");
        }
    </script>
</body>
</html>
