    <script>
        const GOOGLE_SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbzyQjkWKTPF6UHOQWpBzcFemH5nf89QgarwohVzKFl9HBAzzTAN3X2aGz_CX6FLkX8J/exec";

        let currentUser = null;
        let sessionToken = localStorage.getItem("sessionToken") || null;
        let masterDatabase = {};
        let batchTeamsData = {};
        let batchTeamMembers = {};
        let uploadedFiles = {};
        let previewPayload = [];
        let currentSlideIndex = 0;

        let selectedPrintColor = "colour";
        let selectedPrintQuality = "high";
        let selectedPrintOrientation = "portrait";
        let selectedSortOrder = "none";

        const DOCUMENT_LIST = [
            { key: "BA_KRONOLOGI", name: "BA KRONOLOGI", desc: "Berita Acara Kronologi Kejadian Operasional", icon: "📑" },
            { key: "STH_CUSTODY", name: "STH_CUSTODY", desc: "Surat Tanda Serah Terima Custody Operasional", icon: "📋" },
            { key: "STH_DRIVER", name: "STH DRIVER", desc: "Surat Tanda Serah Terima Driver Operasional", icon: "🚗" },
            { key: "FORM_PERGANTIAN_SHIFT", name: "FORM PERGANTIAN SHIFT", desc: "Formulir Serah Terima Pergantian Shift", icon: "🔄" },
            { key: "BERITA_ACARA_UT", name: "BERITA ACARA UT", desc: "Berita Acara Unit / Unscheduled Task", icon: "📝" },
            { key: "FORM_VISITOR_LOG", name: "FORM VISITOR LOG", desc: "Form Catatan Log Logistik Visitor / Tamu", icon: "👤" }
        ];

        const teamGroups = {
            "PAGI": ["TEAM RPL PAGI 1", "TEAM RPL PAGI 2", "TEAM RPL PAGI 3", "TEAM RPL PAGI 4", "TEAM RPL PAGI 5", "TEAM RPL PAGI 6", "TEAM RPL PAGI 7", "TEAM RPL PAGI 8", "TEAM RPL PAGI 9"],
            "MALAM": ["TEAM RPL MALAM 1", "TEAM RPL MALAM 2"],
            "MIDLE": ["TEAM RPL MIDLE 1", "TEAM RPL MIDLE 2", "TEAM RPL MIDLE 3"],
            "SIANG": ["TEAM RPL SIANG 1", "TEAM RPL SIANG 2", "TEAM RPL SIANG 3", "TEAM RPL SIANG 4"]
        };

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function updateSidebarDateTime() {
            const now = new Date();
            const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            const dateString = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

            const lblTime = document.getElementById("lblTime");
            const lblDate = document.getElementById("lblDate");
            if (lblTime) lblTime.innerText = timeString;
            if (lblDate) lblDate.innerText = dateString;
        }
        setInterval(updateSidebarDateTime, 1000);

        function getMasterDataByTid(tid) {
            if (!tid) return null;
            let target = String(tid).trim().toUpperCase();
            if (masterDatabase[target]) return masterDatabase[target];
            let foundKey = Object.keys(masterDatabase).find(k => k.trim().toUpperCase() === target);
            return foundKey ? masterDatabase[foundKey] : null;
        }

        async function handleLogin() {
            const userId = document.getElementById("loginUserId").value.trim().toUpperCase();
            const pwd = document.getElementById("loginPass").value.trim();
            const errLabel = document.getElementById("loginErrorMsg");
            const btnLogin = document.querySelector(".btn-3d-lock");

            if (!userId || !pwd) {
                errLabel.innerText = "⚠️ Isi User ID & Password!";
                errLabel.classList.remove("hidden");
                return;
            }

            btnLogin.innerText = "⌛ VERIFIKASI...";
            btnLogin.disabled = true;

            try {
                let response = await fetch(GOOGLE_SHEETS_API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "login", userId: userId, password: pwd })
                });
                let result = await response.json();

                if (result.status === "success") {
                    sessionToken = result.token;
                    currentUser = result.user;
                    localStorage.setItem("sessionToken", sessionToken);
                    localStorage.setItem("userProfile", JSON.stringify(currentUser));
                    showMainApp();
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                errLabel.innerText = "⚠️ " + (err.message || "Login Gagal!");
                errLabel.classList.remove("hidden");
                document.getElementById("loginCard").classList.add("animate-shake");
            } finally {
                btnLogin.innerText = "🔓 UNLOCK SYSTEM";
                btnLogin.disabled = false;
            }
        }

        function showMainApp() {
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("mainApp").classList.remove("hidden");
            document.getElementById("sidebarRole").innerHTML = `${currentUser.role}<br>BG BEKASI`;
            document.getElementById("lblUser").innerText = `${currentUser.id} - ${currentUser.name}`;

            buildSidebarMenu();

                if (data.batchTeamsData) batchTeamsData = data.batchTeamsData;

        function setupSearchBoxKeyNavigation() {
            const inputs = document.querySelectorAll(".search-nav-input");
            const btnSubmit = document.getElementById("btnSearchSubmit");

            inputs.forEach(input => {
                input.addEventListener("keydown", function(e) {
                    let navIndex = parseInt(this.getAttribute("data-nav"));
                    if (e.key === "Enter" || e.key === "ArrowRight") {
                        e.preventDefault();
                        if (navIndex < inputs.length - 1) {
                            inputs[navIndex + 1].focus();
                            inputs[navIndex + 1].select();
                        } else {
                            searchMasterDataRak();
                            if (btnSubmit) btnSubmit.focus();
                        }
                    } else if (e.key === "ArrowLeft") {
                        e.preventDefault();
                        if (navIndex > 0) {
                            inputs[navIndex - 1].focus();
                            inputs[navIndex - 1].select();
                        }
                    }
                });
            });
        }

        function renderMasterTable(filteredKeys = null) {
            let tbody = document.getElementById("masterTableBody");
            let countBadge = document.getElementById("masterCountBadge");
            let searchInput = document.getElementById("masterSearchInput");
            let keyword = searchInput ? searchInput.value.trim().toUpperCase() : "";
            
            let keys = filteredKeys || Object.keys(masterDatabase);
            if(countBadge) countBadge.innerText = keys.length;

            if (keys.length === 0) {
                if(tbody) tbody.innerHTML = `<tr><td colspan="10" class="text-center p-4 text-red-600 font-extrabold italic text-sm tracking-wide">Data Kosong !!</td></tr>`;
                return;
            }

            let finalKeys = keys.filter(tid => {
                if (filteredKeys) return true;
                let item = masterDatabase[tid] || {};
                let searchStr = [tid, item.lokasi || '', item.merk || item.cluster || '', item.rpl || '', item.flm || '', item.rak || '', item.baris || '', item.kolom || ''].join(" ").toUpperCase();
                return searchStr.includes(keyword);
            });

            if (finalKeys.length === 0) {
                if(tbody) tbody.innerHTML = `<tr><td colspan="10" class="text-center p-4 text-red-600 font-extrabold italic text-sm tracking-wide">Data Kosong !!</td></tr>`;

        function searchMasterDataRak() {

            const allKeys = Object.keys(masterDatabase);
            const filteredKeys = allKeys.filter(tid => {
                let item = masterDatabase[tid] || {};
                let itemRak = String(item.rak || '').trim().toUpperCase();
                let itemBaris = String(item.baris || '').trim().toUpperCase();
                let itemKolom = String(item.kolom || '').trim().toUpperCase();

        async function saveMasterItemManual() {
            if (!currentUser || currentUser.role !== "SUPERVISOR") {
                alert("Aksi ini hanya diperuntukkan untuk SUPERVISOR!");
                return;
            }
            let tid = document.getElementById("m_tid").value.trim().toUpperCase();
            if (!tid) {
                alert("Nomor TID wajib diisi!");
                return;
            }
            let itemData = {
                lokasi: document.getElementById("m_lokasi").value.trim().toUpperCase() || `ATM-${tid}`,
                merk: document.getElementById("m_merk").value.trim().toUpperCase() || "",
                rpl: document.getElementById("m_rpl").value.trim().toUpperCase() || `RPL-${tid}-99`,
                flm: document.getElementById("m_flm").value.trim().toUpperCase() || "",
                rak: document.getElementById("m_rak").value.trim().toUpperCase() || "",
                baris: document.getElementById("m_baris").value.trim().toUpperCase() || "",
                kolom: document.getElementById("m_kolom").value.trim().toUpperCase() || ""
            };

            masterDatabase[tid] = itemData;

            try {
                await fetch(GOOGLE_SHEETS_API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "saveMasterItem", token: sessionToken, tid: tid, itemData: itemData })

        function handleMasterUpload(event) {
            if (!currentUser || currentUser.role !== "SUPERVISOR") {
                alert("Aksi ini hanya diperuntukkan untuk SUPERVISOR!");
                event.target.value = "";
                return;
            }
            const file = event.target.files[0];
            if (!file) return;

            let isConfirmed = confirm("⚠️ PERHATIAN: Fitur ini akan MENGGANTI SELURUH DATA MASTER (Replace All). Lanjutkan?");
            if (!isConfirmed) {
                event.target.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    let newMasterDatabase = {};
                    let count = 0;

                    jsonRows.forEach(row => {
                        let tid = String(row['TID'] || row['tid'] || '').trim().toUpperCase();
                        if (!tid) return;

                        newMasterDatabase[tid] = {
                            lokasi: String(row['LOKASI ATM'] || row['lokasi'] || `ATM-${tid}`).trim().toUpperCase(),
                            merk: String(row['CLUSTER'] || row['MERK ATM'] || row['merk'] || '').trim().toUpperCase(),
                            rpl: String(row['BARCODE RPL'] || row['rpl'] || `RPL-${tid}-99`).trim().toUpperCase(),
                            flm: String(row['BARCODE FLM'] || row['flm'] || '').trim().toUpperCase(),
                            rak: String(row['RAK'] || row['rak'] || '').trim().toUpperCase(),
                            baris: String(row['BARIS'] || row['baris'] || '').trim().toUpperCase(),
                            kolom: String(row['KOLOM'] || row['kolom'] || '').trim().toUpperCase()
                        };
                        count++;
                    });

                    masterDatabase = newMasterDatabase;

                    await fetch(GOOGLE_SHEETS_API_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "replaceMasterData", token: sessionToken, masterDatabase: masterDatabase })
                    });

                    renderMasterTable();
                    alert(`✅ Berhasil mengganti seluruh data master! ${count} data baru tersimpan.`);
                } catch (err) {
                    alert("Format file Excel/CSV tidak valid.");
                } finally {
                    event.target.value = "";
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function filterBatchBarcodeItems() {

        function printSelectedBatchBarcodes() {
            let checkedInputs = document.querySelectorAll(".batch-tid-checkbox:checked");
            if (checkedInputs.length === 0) {
                alert("Pilih minimal 1 TID untuk dicetak!");
                return;
            }

            let type = document.getElementById("batchBarcodeType").value;
            let labelsHtml = "";

            checkedInputs.forEach(cb => {
                let tid = cb.value;
                let item = getMasterDataByTid(tid) || {};
                let barcodeVal = tid;

                if (type === "rpl") barcodeVal = item.rpl || `A4TMFD0117`;
                else if (type === "flm") barcodeVal = item.flm || `FLM-${tid}`;

                let tempSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                try {
                    JsBarcode(tempSvg, barcodeVal, { format: "CODE128", displayValue: false, height: 28, width: 1.0, margin: 0 });

                labelsHtml += `
                    <div class="barcode-label-box">
                        ${tempSvg.outerHTML}
                        <div class="barcode-label-text">${escapeHtml(barcodeVal)}</div>

            let printWindow = window.open('', '', 'width=900,height=600');
            printWindow.document.write(`

                        <style>

                            .barcode-label-text { font-family: 'Times New Roman', Times, serif; font-weight: bold; font-size: 11px; color: #000000; letter-spacing: 0.5px; margin-top: -2px; }

        function updateRealtimePreview() {
            let memberNameInput = document.getElementById("inputTeamMember");
            let memberNameLabel = document.getElementById("previewMemberName");
            if (memberNameInput && memberNameLabel) memberNameLabel.innerText = memberNameInput.value.trim().toUpperCase() || "-";

            let inputs = document.querySelectorAll(".tid-input");
            let notFoundCount = 0;
            let duplicateCount = 0;

            let tidFrequency = {};
            inputs.forEach(inp => {
                let val = inp.value.trim().toUpperCase();
                if (val) tidFrequency[val] = (tidFrequency[val] || 0) + 1;
            });

            inputs.forEach((inp, i) => {
                let tidRaw = inp.value.trim();
                let tidUpper = tidRaw.toUpperCase();
                let parentCell = inp.closest(".cell-container");
                let row = document.getElementById(`preview-row-${i}`);

                if (tidRaw !== "") {
                    let master = getMasterDataByTid(tidUpper);
                    let isExist = !!master;
                    let isDuplicate = tidFrequency[tidUpper] > 1;

                    if (parentCell) parentCell.classList.remove("tid-not-found", "tid-duplicate");

                    if (isDuplicate) {
                        duplicateCount++;
                        if (parentCell) parentCell.classList.add("tid-duplicate");
                    } else if (!isExist) {
                        notFoundCount++;
                        if (parentCell) parentCell.classList.add("tid-not-found");
                    }

                    if (row) {
                        row.style.display = "";
                        row.cells[1].innerText = tidUpper;
                        if (isDuplicate) {
                            row.cells[2].innerText = `⚠️ DUPLIKAT (${(master && master.lokasi) ? master.lokasi : 'ATM ' + tidUpper})`;
                        } else if (!isExist) {
                            row.cells[2].innerText = "⚠️ TID TIDAK TERDAFTAR";
                            row.cells[3].innerText = "-";
                        } else {
                            row.cells[2].innerText = master.lokasi || `ATM-${tidUpper}`;
                            row.cells[3].innerText = master.merk || master.cluster || "";
                            row.cells[4].innerText = master.rpl || `RPL-${tidUpper}-99`;
                            row.cells[5].innerText = master.flm || "";
                            row.cells[6].innerText = master.rak || "";
                            row.cells[7].innerText = master.baris || "";
                            row.cells[8].innerText = master.kolom || "";
                        }
                    }
                } else {
                    if (parentCell) parentCell.classList.remove("tid-not-found", "tid-duplicate");
                    if (row) row.style.display = "none";
                }
            });

            let warningBadge = document.getElementById("warningCounterBadge");
            let warningCount = document.getElementById("warningCounterCount");
            if (warningBadge && warningCount) {
                if (notFoundCount > 0) {
                    warningCount.innerText = notFoundCount;
                    warningBadge.classList.remove("hidden");
                } else warningBadge.classList.add("hidden");
            }

            let dupBadge = document.getElementById("duplicateCounterBadge");
            let dupCount = document.getElementById("duplicateCounterCount");
            if (dupBadge && dupCount) {
                if (duplicateCount > 0) {
                    dupCount.innerText = duplicateCount;
                    dupBadge.classList.remove("hidden");
                } else dupBadge.classList.add("hidden");
            }
        }

        function setupExcelInteractions(teamName) {
            const inputs = document.querySelectorAll(".tid-input");
            inputs.forEach(input => {
                input.addEventListener("paste", function(e) {
                    e.preventDefault();
                    let clipboardData = (e.clipboardData || window.clipboardData).getData("text");
                    if (!clipboardData) return;

                    let lines = clipboardData.split(/\r\n|\n|\r/).map(item => item.trim()).filter(item => item !== "");
                    if (lines.length > 0) {
                        let currentIndex = parseInt(this.getAttribute("data-index"));
                        lines.forEach((lineText, offset) => {
                            let targetIndex = currentIndex + offset;
                            if (targetIndex < 18 && targetIndex < inputs.length) {
                                inputs[targetIndex].value = lineText.replace(/\s+/g, '').toUpperCase();
                            }
                        });
                        autoSaveDraft(teamName);
                        updateRealtimePreview();
                    }
                });
            });
        }

        async function autoSaveDraft(teamName) {
            let memberName = document.getElementById("inputTeamMember") ? document.getElementById("inputTeamMember").value.trim() : "";
            let tids = [];
            let inputs = document.querySelectorAll(".tid-input");
            inputs.forEach((inp, idx) => {
                if (idx < 18 && inp.value.trim() !== "") tids.push(inp.value.trim().toUpperCase());
            });
            batchTeamsData[teamName] = tids;
            if (memberName) batchTeamMembers[teamName] = memberName;

            try {
                await fetch(GOOGLE_SHEETS_API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "saveTeamData",
                        token: sessionToken,
                        batchTeamsData: batchTeamsData,
                        batchTeamMembers: batchTeamMembers
                    })
                });
            } catch (err) {}
        }

        function clearAllTids(teamName) {
            if (confirm("Hapus semua TID pada team ini?")) {
                document.querySelectorAll(".tid-input").forEach(inp => inp.value = "");
                batchTeamsData[teamName] = [];
                autoSaveDraft(teamName);
                updateRealtimePreview();
            }
        }

        function saveAndReturnMenu(teamName) {
            autoSaveDraft(teamName);
            renderTeamMenuHtml();
        }

        function saveTeamAndPrint(teamName) {
            autoSaveDraft(teamName);
            let tids = batchTeamsData[teamName] || [];
            if (tids.length === 0) {
                alert("Masukkan minimal 1 TID!");
                return;
            }
            let singleData = {};
            singleData[teamName] = tids;
            preparePreview(singleData);
        }

        function directPrintAllTeams() {
            preparePreview(batchTeamsData);
            printAllSlides();
        }

        function renderAllDataSummaryPreview() {
            preparePreview(batchTeamsData);
        }

        function clearAllTeamsTid() {
            if (confirm("Hapus semua TID dari seluruh team?")) {
                batchTeamsData = {};
                fetch(GOOGLE_SHEETS_API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "saveTeamData", token: sessionToken, batchTeamsData: {}, batchTeamMembers: batchTeamMembers })
                });
                renderTeamMenuHtml();
            }
        }

        function preparePreview(dataDict) {
            previewPayload = [];
            for (let [tName, tids] of Object.entries(dataDict)) {
                if (!tids || tids.length === 0) continue;
                let memberName = batchTeamMembers[tName] || "-";
                let limitedTids = tids.slice(0, 18);

                let teamRows = [];
                limitedTids.forEach((tidRaw, i) => {
                    let tid = String(tidRaw).toUpperCase();
                    let master = getMasterDataByTid(tid) || {};
                    teamRows.push({
                        no: i + 1,
                        tid: tid,
                        lokasi: master.lokasi || `ATM-${tid}`,
                        merk: master.merk || master.cluster || "",
                        rpl: master.rpl || `RPL-${tid}-99`,
                        flm: master.flm || "",
                        rak: master.rak || "",
                        baris: master.baris || "",
                        kolom: master.kolom || ""
                    });
                });

                previewPayload.push({ team_name: tName, member_name: memberName, data: teamRows });
            }
            currentSlideIndex = 0;
            renderSlideView();
        }

        function renderSlideView() {
            const content = document.getElementById("contentArea");
            if (!previewPayload || previewPayload.length === 0) return;
            let item = previewPayload[currentSlideIndex];

            let rowsHtml = "";
            item.data.forEach((row, rIdx) => {
                rowsHtml += `
                    <tr class="${rIdx % 2 === 0 ? 'bg-slate-50' : 'bg-white'} text-xs">
                        <td class="border border-black p-2 col-no text-slate-900 font-normal">${rIdx + 1}</td>
                        <td class="border border-black p-2 col-tid text-slate-950 font-normal">${escapeHtml(row.tid)}</td>
                        <td class="border border-black p-2 col-lokasi text-slate-950 font-normal">${escapeHtml(row.lokasi)}</td>
                        <td class="border border-black p-2 col-merk text-slate-950 font-normal">${escapeHtml(row.merk)}</td>
                        <td class="border border-black p-2 col-rpl font-mono font-normal">${escapeHtml(row.rpl)}</td>
                        <td class="border border-black p-2 col-flm font-mono font-normal">${escapeHtml(row.flm)}</td>
                        <td class="border border-black p-2 col-rak text-slate-900 font-normal">${escapeHtml(row.rak)}</td>
                        <td class="border border-black p-2 col-baris text-slate-900 font-normal">${escapeHtml(row.baris)}</td>
                        <td class="border border-black p-2 col-kolom text-slate-900 font-normal">${escapeHtml(row.kolom)}</td>
                        <td class="border border-black p-2 col-ket font-normal"></td>
                        <td class="border border-black p-2 col-no font-normal"></td>
                    </tr>
                `;
            });

            content.innerHTML = `
                <div class="flex flex-wrap justify-between items-center mb-4 bg-slate-100 p-2.5 rounded-lg border border-slate-200">
                    <button onclick="renderTeamMenuHtml()" class="bg-slate-600 text-white text-xs font-bold px-3.5 py-1.5 rounded">⬅ Kembali</button>
                    <div class="flex items-center gap-2">
                        <button onclick="if(currentSlideIndex>0){currentSlideIndex--;renderSlideView();}" class="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded">◀ Prev</button>
                        <span class="text-xs font-bold">${currentSlideIndex + 1} / ${previewPayload.length}</span>
                        <button onclick="if(currentSlideIndex<previewPayload.length-1){currentSlideIndex++;renderSlideView();}" class="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded">Next ▶</button>
                    </div>
                    <button onclick="window.print()" class="bg-emerald-600 text-white text-xs font-bold px-4 py-1.5 rounded">🖨️ CETAK SLIDE INI</button>
                </div>

                <div id="printArea" class="border-2 border-black bg-white p-3 rounded-xl shadow-md max-w-[210mm] mx-auto">
                    <table class="w-full border-collapse border-2 border-black printable-table-border">
                        <thead>
                            <tr>
                                <th colspan="11" class="bg-white text-black border-2 border-black p-2.5 text-center font-extrabold text-base">
                                    <div class="flex items-center justify-center gap-8">
                                        <span>${escapeHtml(item.team_name)}</span>
                                        <span class="uppercase text-sm">CUSTODY : ${escapeHtml(item.member_name)}</span>
                                    </div>
                                </th>
                            </tr>
                            <tr class="bg-white text-black font-extrabold text-[11px] uppercase border-b-2 border-black">
                                <th class="border border-black p-2 col-no">NO</th>
                                <th class="border border-black p-2 col-tid">TID</th>
                                <th class="border border-black p-2 col-lokasi">LOKASI</th>
                                <th class="border border-black p-2 col-merk">CLUSTER</th>
                                <th class="border border-black p-2 col-rpl">RPL</th>
                                <th class="border border-black p-2 col-flm">FLM</th>
                                <th class="border border-black p-2 col-rak">RAK</th>
                                <th class="border border-black p-2 col-baris">BARIS</th>
                                <th class="border border-black p-2 col-kolom">KOLOM</th>
                                <th class="border border-black p-2 col-ket">KET</th>
                                <th class="border border-black p-2 col-no"></th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </div>
            `;
        }

        function printAllSlides() {
            window.print();
        }

        function downloadMasterdataExcel() {
            let keys = Object.keys(masterDatabase);
            if (keys.length === 0) {
                alert("Belum ada data master untuk di-download.");
                return;
            }
            let excelRows = keys.map((tid, i) => ({
                "NO": i + 1, "TID": tid, "LOKASI": masterDatabase[tid].lokasi || "", "CLUSTER": masterDatabase[tid].merk || "", "RPL": masterDatabase[tid].rpl || "", "FLM": masterDatabase[tid].flm || ""
            }));
            const worksheet = XLSX.utils.json_to_sheet(excelRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Masterdata");
            XLSX.writeFile(workbook, `MASTERDATA_KUNCI_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        function openAddUserModal() { document.getElementById("modalAddUser").classList.remove("hidden"); }
        function closeAddUserModal() { document.getElementById("modalAddUser").classList.add("hidden"); }

        async function submitNewUserModal() {
            let uId = document.getElementById("modalNewUserId").value.trim();
            let pwd = document.getElementById("modalNewPwd").value.trim();
            let name = document.getElementById("modalNewName").value.trim();

            if (!uId || !pwd || !name) {
                alert("Semua field wajib diisi!");
                return;
            }

            try {
                let res = await fetch(GOOGLE_SHEETS_API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "addUser", token: sessionToken, newUserId: uId, newPassword: pwd, newName: name })
                });
                let result = await res.json();
                alert(result.message);
                if (result.status === "success") closeAddUserModal();
            } catch (err) {
                alert("Gagal menambah user admin.");
            }
        }

        function focusPasswordInput() { document.getElementById("loginPass").focus(); }
        function clearLoginError() { document.getElementById("loginErrorMsg").classList.add("hidden"); }

        const savedProfile = localStorage.getItem("userProfile");
        if (sessionToken && savedProfile) {
            currentUser = JSON.parse(savedProfile);
            showMainApp();
        }
    </script>
</body>
