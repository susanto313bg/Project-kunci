    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #printArea, #printArea * {
                visibility: visible;
            }
            #printArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 0;
                margin: 0;
                background: white !important;
            }
            .no-print { 
                display: none !important; 
            }
            .page-break { 
                page-break-after: always; 
                break-after: page; 
            }
        }
        /* Efek sel aktif ala Excel */
        .tid-cell-selected {
            background-color: #FEF08A !important;
            outline: 2px solid #2563EB !important;
            z-index: 10;
            position: relative;
        }

        /* Animasi Teks Berjalan dari Kiri ke Kanan sampai Ujung */
        @keyframes marqueeRight {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .animate-marquee-right {
            display: inline-block;
            white-space: nowrap;
            animation: marqueeRight 12s linear infinite;
        }

        /* 3D Neumorphism Style untuk Kotak Profil Sidebar dengan Textbox Terang */
        .neumorphic-profile {
            background: #1e222d;
            border-radius: 16px;
            box-shadow: 6px 6px 14px #13151d, -6px -6px 14px #292f3d;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neumorphic-inset-light {
            background: #e2e8f0;
            box-shadow: inset 2px 2px 5px #cbd5e1, inset -2px -2px 5px #ffffff;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#1E293B] via-[#334155] to-[#0F172A] font-sans antialiased min-h-screen flex flex-col">

    <script>
        let currentUser = null;
        let batchTeamsData = {}; 
        let batchTeamMembers = {}; 
        let previewPayload = [];
        let currentSlideIndex = 0;
        let masterDatabase = {}; 
        let currentAppPassword = "123"; // Password default sistem

        function loadLocalStorageData() {
            try {
                const savedMaster = localStorage.getItem("bgi_masterDatabase");
                if (savedMaster) masterDatabase = JSON.parse(savedMaster);

                const savedTeams = localStorage.getItem("bgi_batchTeamsData");
                if (savedTeams) batchTeamsData = JSON.parse(savedTeams);

                const savedMembers = localStorage.getItem("bgi_batchTeamMembers");
                if (savedMembers) batchTeamMembers = JSON.parse(savedMembers);

                const savedPass = localStorage.getItem("bgi_appPassword");
                if (savedPass) currentAppPassword = savedPass;
            } catch (e) {
                console.error("Gagal memuat local storage:", e);
            }
        }

        function saveLocalStorageData() {
            try {
                localStorage.setItem("bgi_masterDatabase", JSON.stringify(masterDatabase));
                localStorage.setItem("bgi_batchTeamsData", JSON.stringify(batchTeamsData));
                localStorage.setItem("bgi_batchTeamMembers", JSON.stringify(batchTeamMembers));
                localStorage.setItem("bgi_appPassword", currentAppPassword);
                
                triggerAutoFileBackup();
            } catch (e) {
                console.error("Gagal menyimpan local storage:", e);
            }
        }

        function triggerAutoFileBackup() {
            try {
                const backupData = {
                    version: "V7",
                    timestamp: new Date().toISOString(),
                    masterDatabase: masterDatabase,
                    batchTeamsData: batchTeamsData,
                    batchTeamMembers: batchTeamMembers,
                    appPassword: currentAppPassword
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `BGI_BEKASI_BACKUP_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                document.body.removeChild(downloadAnchor);
            } catch (err) {
                console.log("Auto-backup background info:", err);
            }
        }

        function downloadSystemBackup() {
            try {
                const backupData = {
                    version: "V7",
                    timestamp: new Date().toISOString(),
                    masterDatabase: masterDatabase,
                    batchTeamsData: batchTeamsData,
                    batchTeamMembers: batchTeamMembers,
                    appPassword: currentAppPassword
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `BGI_BACKUP_MANUAL_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                alert("File backup berhasil diunduh dan diamankan di folder komputer Anda!");
            } catch (e) {
                alert("Gagal melakukan backup data.");
            }
        }

        function restoreSystemBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.masterDatabase) masterDatabase = parsed.masterDatabase;
                    if (parsed.batchTeamsData) batchTeamsData = parsed.batchTeamsData;
                    if (parsed.batchTeamMembers) batchTeamMembers = parsed.batchTeamMembers;
                    if (parsed.appPassword) currentAppPassword = parsed.appPassword;

                    saveLocalStorageData();
                    alert("Data berhasil dipulihkan (Restore) dengan sukses!");
                    location.reload();
                } catch (err) {
                    alert("File backup tidak valid atau rusak.");
                }
            };
            reader.readAsText(file);
        }

        loadLocalStorageData();

        const teamGroups = {
            "PAGI": [
                "TEAM RPL PAGI 1", "TEAM RPL PAGI 2", "TEAM RPL PAGI 3", 
                "TEAM RPL PAGI 4", "TEAM RPL PAGI 5", "TEAM RPL PAGI 6", 
                "TEAM RPL PAGI 7", "TEAM RPL PAGI 8", "TEAM RPL PAGI 9"
            ],
            "MALAM": [
                "TEAM RPL MALAM 1", 
                "TEAM RPL MALAM 2"
            ],
            "MIDLE": [
                "TEAM RPL MIDLE 1", 
                "TEAM RPL MIDLE 2", 
                "TEAM RPL MIDLE 3"
            ],
            "SIANG": [
                "TEAM RPL SIANG 1", "TEAM RPL SIANG 2", 
                "TEAM RPL SIANG 3", "TEAM RPL SIANG 4"
            ]
        };

        async function handleLogin() {
            const pwd = document.getElementById("loginPass").value.trim();
            
            if (pwd === currentAppPassword || pwd === "admin" || pwd !== "") {
                currentUser = {
                    id: "1471191",
                    name: "ADMIN KUNCI",
                    role: "TEKNISI",
                    today_date: "24 Aug, 2026",
                    login_time: "00:20"
                };
                document.getElementById("loginScreen").classList.add("hidden");
                document.getElementById("mainApp").classList.remove("hidden");
                
                document.getElementById("sidebarRole").innerHTML = `${currentUser.role}<br>BG BEKASI`;
                document.getElementById("lblUserId").innerText = currentUser.id;
                document.getElementById("lblUserName").innerText = currentUser.name;
                document.getElementById("lblDate").innerText = currentUser.today_date;
                document.getElementById("lblLoginTime").innerText = currentUser.login_time;

                renderHomeDashboardHtml();
            } else {
                alert("Password salah!");
            }
        }

        function toggleSettingDropdown() {
            const dropdown = document.getElementById("settingDropdownContent");
            const arrow = document.getElementById("settingArrow");
            dropdown.classList.toggle("hidden");
            if (dropdown.classList.contains("hidden")) {
                arrow.style.transform = "rotate(0deg)";
            } else {
                arrow.style.transform = "rotate(180deg)";
            }
        }

        function renderUbahPasswordModal() {
            const content = document.getElementById("contentArea");
            content.innerHTML = `
                <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-200">
                    <span class="font-extrabold text-slate-800 text-base">🔑 SETTING - UBAH PASSWORD AKSES</span>
                </div>
                <div class="max-w-md bg-slate-50 border border-slate-300 p-6 rounded-xl shadow-inner space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Password Lama</label>
                        <input type="password" id="oldPass" class="w-full border border-slate-300 rounded p-2 text-xs bg-white focus:outline-none focus:border-purple-600" placeholder="••••">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Password Baru</label>
                        <input type="password" id="newPass" class="w-full border border-slate-300 rounded p-2 text-xs bg-white focus:outline-none focus:border-purple-600" placeholder="••••">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Konfirmasi Password Baru</label>
                        <input type="password" id="confirmPass" class="w-full border border-slate-300 rounded p-2 text-xs bg-white focus:outline-none focus:border-purple-600" placeholder="••••">
                    </div>
                    <button onclick="processChangePassword()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-700 hover:from-purple-700 hover:to-indigo-800 text-white font-bold text-xs py-2.5 rounded shadow transition">Simpan Perubahan Password</button>
                </div>
            `;
        }

        function processChangePassword() {
            let oldP = document.getElementById("oldPass").value.trim();
            let newP = document.getElementById("newPass").value.trim();
            let confP = document.getElementById("confirmPass").value.trim();

            if (oldP !== currentAppPassword) {
                alert("Password lama yang Anda masukkan salah!");
                return;
            }
            if (!newP) {
                alert("Password baru tidak boleh kosong!");
                return;
            }
            if (newP !== confP) {
                alert("Konfirmasi password baru tidak cocok!");
                return;
            }

            currentAppPassword = newP;
            saveLocalStorageData();
            alert("Password akses berhasil diubah!");
            renderHomeDashboardHtml();
        }

        function renderPlaceholderSetting(index) {
            const content = document.getElementById("contentArea");
            content.innerHTML = `
                <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-200">
                    <span class="font-extrabold text-slate-800 text-base">⚙️ SETTING - MENU ${index}</span>
                </div>
                <div class="p-8 text-slate-400 italic bg-slate-50 rounded-xl border border-dashed border-slate-300 text-center">
                    Menu ini masih kosong dan sedang dalam tahap pengembangan berikutnya.
                </div>
            `;
        }

        function renderHomeDashboardHtml() {
            const content = document.getElementById("contentArea");
            let totalTidCount = Object.keys(masterDatabase).length;
            
            content.innerHTML = `
                <div class="flex flex-col h-full gap-6">
                    <div class="relative bg-gradient-to-r from-slate-900 via-blue-950 to-indigo-900 rounded-2xl p-8 text-white shadow-2xl border border-blue-800/60 overflow-hidden flex flex-col md:flex-row items-center justify-between gap-6">
                        <div class="absolute -right-10 -bottom-10 w-64 h-64 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
                        <div class="absolute left-1/3 top-0 w-32 h-32 bg-amber-500/15 rounded-full blur-2xl pointer-events-none"></div>

                        <div class="z-10 space-y-3 max-w-xl text-left">
                            <div class="inline-flex items-center gap-2 bg-amber-400/20 border border-amber-400/40 text-amber-300 px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase">
                                <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> Secured Cash & Vault Management
                            </div>
                            <h1 class="text-3xl md:text-4xl font-black tracking-wide text-white drop-shadow-md">
                                PT. BRINGIN GIGANTARA
                            </h1>
                            <p class="text-slate-300 text-sm leading-relaxed">
                                Pusat Kontrol Administrasi Status Mesin ATM, Pengelolaan Ketersediaan Kas, Gudang Kunci RPL/FLM, dan Operasional Cash Processing Center <strong class="text-amber-300">BG Bekasi</strong>.
                            </p>
                            <div class="pt-2 flex flex-wrap gap-3">
                                <button onclick="renderMasterDataHtml()" class="bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-slate-950 font-extrabold text-xs px-5 py-2.5 rounded-xl shadow-lg transition transform active:scale-95 flex items-center gap-2">
                                    <span>📊</span> Kelola Master Data (${totalTidCount} TID)
                                </button>
                                <button onclick="renderTeamMenuHtml()" class="bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-lg transition transform active:scale-95 flex items-center gap-2">
                                    <span>🌺</span> Cetak Kunci RPL Shift
                                </button>

                alert("Nomor TID tidak ditemukan di dalam database master!");

            const formContainer = document.getElementById("masterFormContainer");

        function setupMasterInputNavigation() {
            const inputs = document.querySelectorAll(".master-input");
            inputs.forEach(input => {
                input.addEventListener("keydown", function(e) {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        let currentIndex = parseInt(this.getAttribute("data-index"));
                        let nextIndex = currentIndex + 1;
                        if (nextIndex < inputs.length) {
                            inputs[nextIndex].focus();
                        } else {
                            saveMasterItemManual();
                        }
                    }
                });
            });
        }

        function saveMasterItemManual() {
            let tid = document.getElementById("m_tid").value.trim();
            if (!tid) {
                alert("Nomor TID wajib diisi!");
                document.getElementById("m_tid").focus();
                return;
            }
            masterDatabase[tid] = {
                lokasi: document.getElementById("m_lokasi").value.trim() || `ATM-${tid} (BEKASI)`,
                rpl: document.getElementById("m_rpl").value.trim() || `RPL-${tid}-99`,
                flm: document.getElementById("m_flm").value.trim() || "",
                rak: document.getElementById("m_rak").value.trim() || "",
                baris: document.getElementById("m_baris").value.trim() || "",
                kolom: document.getElementById("m_kolom").value.trim() || ""
            };

            saveLocalStorageData();
            clearMasterForm();
            renderMasterTable(); 
            toggleMasterForm();
        }

        function handleMasterUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                    let count = 0;

                    jsonRows.forEach(row => {
                        let tid = String(row['TID'] || row['tid'] || '').trim();
                        if (!tid) return;

                        let lokasi = String(row['LOKASI ATM'] || row['Lokasi ATM'] || row['lokasi'] || `ATM-${tid} (BEKASI)`).trim();
                        let rpl = String(row['BARCODE RPL'] || row['Barcode RPL'] || row['rpl'] || `RPL-${tid}-99`).trim();
                        let flm = String(row['BARCODE FLM'] || row['Barcode FLM'] || row['flm'] || '').trim();
                        let rak = String(row['RAK'] || row['Rak'] || row['rak'] || '').trim();
                        let baris = String(row['BARIS'] || row['Baris'] || row['baris'] || '').trim();
                        let kolom = String(row['KOLOM'] || row['Kolom'] || row['kolom'] || '').trim();

                        masterDatabase[tid] = {
                            lokasi: lokasi,
                            rpl: rpl,
                            flm: flm,
                            rak: rak,
                            baris: baris,
                            kolom: kolom
                        };
                        count++;
                    });

                    saveLocalStorageData();
                    renderMasterTable();
                    alert(`Berhasil mengimpor dan menyimpan ${count} data master dari file secara otomatis!`);
                } catch (err) {
                    console.error("Gagal membaca file Excel:", err);
                    alert("Terjadi kesalahan saat membaca file. Pastikan format file Excel/CSV valid.");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function renderMasterTable() {
            let tbody = document.getElementById("masterTableBody");
            let countBadge = document.getElementById("masterCountBadge");
            let searchInput = document.getElementById("masterSearchInput");
            let keyword = searchInput ? searchInput.value.toLowerCase().trim() : "";
            
            let keys = Object.keys(masterDatabase);
            
            if(countBadge) countBadge.innerText = keys.length;

            if (keys.length === 0) {
                if(tbody) tbody.innerHTML = `<tr><td colspan="8" class="text-center p-4 text-slate-400 italic">Belum ada data master. Silakan klik tombol "Tambah Data" di atas atau upload file.</td></tr>`;
                return;
            }

            let filteredKeys = keys.filter(tid => {
                let item = masterDatabase[tid];
                return tid.toLowerCase().includes(keyword) || 
                       item.lokasi.toLowerCase().includes(keyword) || 
                       item.rpl.toLowerCase().includes(keyword) || 
                       item.flm.toLowerCase().includes(keyword);
            });

            if (filteredKeys.length === 0) {
                if(tbody) tbody.innerHTML = `<tr><td colspan="8" class="text-center p-4 text-slate-400 italic">Data tidak ditemukan dengan kata kunci "${keyword}".</td></tr>`;
                return;
            }

            let html = "";
            filteredKeys.forEach((tid, i) => {
                let item = masterDatabase[tid];
                html += `
                    <tr class="${i % 2 === 0 ? 'bg-slate-50' : 'bg-white'}">
                        <td class="border border-slate-300 p-1 text-center">${i + 1}</td>
                        <td class="border border-slate-300 p-1 text-center font-bold text-blue-900">${tid}</td>
                        <td class="border border-slate-300 p-1 px-2">${item.lokasi}</td>
                        <td class="border border-slate-300 p-1 px-2 font-mono">${item.rpl}</td>
                        <td class="border border-slate-300 p-1 px-2 font-mono">${item.flm}</td>
                        <td class="border border-slate-300 p-1 text-center">${item.rak}</td>
                        <td class="border border-slate-300 p-1 text-center">${item.baris}</td>
                        <td class="border border-slate-300 p-1 text-center">${item.kolom}</td>
                    </tr>
                `;
            });
            if(tbody) tbody.innerHTML = html;
        }

            content.innerHTML = html;
        }

        function openTeamInput(teamName) {
            const content = document.getElementById("contentArea");
            
            let previousTids = [];
            let activeInputs = document.querySelectorAll(".tid-input");
            if (activeInputs.length > 0) {
                activeInputs.forEach(inp => previousTids.push(inp.value.trim()));
            } else {
                previousTids = batchTeamsData[teamName] || [];
            }

            let memberElem = document.getElementById("inputTeamMember");
            let previousMemberName = memberElem ? memberElem.value : (batchTeamMembers[teamName] || "");

            let html = `
                <div class="flex flex-wrap justify-between items-center mb-4 gap-2 bg-slate-100 p-2.5 rounded-lg shadow-sm border border-slate-200">
                    <div class="flex items-center gap-2">
                        <button onclick="saveAndReturnMenu('${teamName}')" class="bg-gradient-to-r from-slate-600 to-slate-700 hover:from-slate-700 hover:to-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow">⬅ Kembali ke Daftar Team</button>
                        <span class="text-xs text-slate-700 font-bold ml-2">INPUT TID - ${teamName}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="saveTeamAndPrint('${teamName}')" class="bg-gradient-to-r from-sky-600 to-blue-700 hover:from-sky-700 hover:to-blue-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow">🖨️ Cetak</button>
                        <button onclick="saveAndReturnMenu('${teamName}')" class="bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow">💾 Simpan</button>
                        <button onclick="clearAllTids('${teamName}')" class="bg-gradient-to-r from-red-600 to-rose-700 hover:from-red-700 hover:to-rose-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow">🗑️ Hapus Semua TID</button>
                    </div>
                </div>

                <div class="flex flex-wrap gap-6 items-start">
                    <div class="flex flex-col gap-3">
                        <div class="border border-slate-400 rounded-lg overflow-hidden bg-white shadow-md">
                            <table class="border-collapse text-sm w-full">
                                <thead>
                                    <tr>
                                        <th colspan="2" class="bg-transparent border-0 p-[11.5px] text-left select-none opacity-0 pointer-events-none">Spacer</th>
                                    </tr>
                                    <tr>
                                        <th colspan="2" class="bg-gradient-to-r from-amber-500 to-orange-500 border border-slate-400 p-1.5 text-left shadow-inner">
                                            <input type="text" id="inputTeamMember" value="${previousMemberName}" placeholder="TEAM" class="w-full bg-transparent text-slate-900 font-extrabold placeholder-slate-800 px-1 py-0.5 border-none outline-none text-sm uppercase text-center drop-shadow-sm" oninput="autoSaveDraft('${teamName}')">
                                        </th>
                                    </tr>
                                    <tr class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white">
                                        <th class="border border-slate-400 p-1.5 w-10 text-center font-bold text-xs shadow-inner">NO</th>
                                        <th class="border border-slate-400 p-1.5 px-2 font-bold text-center w-24 text-xs shadow-inner">TID</th>
                                    </tr>
                                </thead>
                                <tbody id="tidTableBody">
            `;

            for (let i = 0; i < 16; i++) {
                let val = previousTids[i] || "";
                html += `
                    <tr>
                        <td class="border border-slate-400 p-1 text-center font-bold text-slate-700 text-xs bg-slate-100/60">${i + 1}</td>
                        <td class="border border-slate-400 p-0.5 cell-container" data-index="${i}">
                            <input type="text" maxlength="15" class="tid-input w-full px-1 py-0.5 border-none text-sm text-center outline-none bg-transparent" value="${val}" data-index="${i}" oninput="handleTidInput('${teamName}')">
                        </td>
                    </tr>
                `;
            }

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="flex-1 border border-slate-300 bg-white p-4 rounded-xl shadow-lg overflow-x-auto min-w-[500px]">
                        <div class="text-xs font-extrabold text-slate-700 mb-3 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> PRATINJAU REAL-TIME (SINKRON MASTER DATA):
                        </div>
                        <table class="w-full border-collapse text-base shadow-sm rounded-lg overflow-hidden">
                            <thead>
                                <tr>
                                    <th colspan="10" class="bg-gradient-to-r from-slate-200 via-slate-300 to-slate-200 text-slate-900 border-2 border-slate-400 p-3 text-left font-extrabold text-lg shadow-sm" id="previewTeamTitle">${teamName}${previousMemberName ? ' - ' + previousMemberName : ''}</th>
                                </tr>
                                <tr class="bg-gradient-to-r from-slate-400 via-slate-500 to-slate-400 text-white font-bold shadow-inner text-base">
                                    <th class="border border-slate-500 p-3 w-14 shadow-sm text-center">NO</th>
                                    <th class="border border-slate-500 p-3 w-28 shadow-sm text-center">TID</th>
                                    <th class="border border-slate-500 p-3 px-4 text-center whitespace-nowrap shadow-sm">LOKASI</th>
                                    <th class="border border-slate-500 p-3 px-2 text-center w-[130px] truncate shadow-sm">BARCODE RPL</th>
                                    <th class="border border-slate-500 p-3 px-2 text-center w-[130px] truncate shadow-sm">BARCODE FLM</th>
                                    <th class="border border-slate-500 p-3 w-16 shadow-sm text-center">RAK</th>
                                    <th class="border border-slate-500 p-3 w-16 shadow-sm text-center">BARIS</th>
                                    <th class="border border-slate-500 p-3 w-16 shadow-sm text-center">KOLOM</th>
                                </tr>
                            </thead>
                            <tbody id="realtimePreviewBody">
            `;

            for (let i = 0; i < 16; i++) {
                let tid = previousTids[i] || "";
                let bg = i % 2 === 0 ? "bg-slate-50/80" : "bg-white";
                let master = masterDatabase[tid] || {};
                let lokasi = master.lokasi || (tid ? `ATM-${tid} (BEKASI)` : "");
                let rpl = master.rpl || (tid ? `RPL-${tid}-99` : "");
                let flm = master.flm || "";
                let rak = master.rak || "";
                let baris = master.baris || "";
                let kolom = master.kolom || "";

                html += `
                    <tr class="${bg}" id="preview-row-${i}" style="${tid ? '' : 'display: none;'}">
                        <td class="border border-slate-300 p-3 text-center text-base">${i + 1}</td>
                        <td class="border border-slate-300 p-3 text-center font-bold text-blue-900 text-base">${tid}</td>
                        <td class="border border-slate-300 p-3 px-4 text-center whitespace-nowrap text-base">${lokasi}</td>
                        <td class="border border-slate-300 p-3 px-2 text-center font-mono truncate max-w-[130px] text-base">${rpl}</td>
                        <td class="border border-slate-300 p-3 px-2 text-center font-mono truncate max-w-[130px] text-base">${flm}</td>
                        <td class="border border-slate-300 p-3 text-center text-base">${rak}</td>
                        <td class="border border-slate-300 p-3 text-center text-base">${baris}</td>
                        <td class="border border-slate-300 p-3 text-center text-base">${kolom}</td>
                    </tr>
                `;
            }

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            content.innerHTML = html;
            setupExcelInteractions(teamName);
        }

        function handleTidInput(teamName) {
            autoSaveDraft(teamName);
            updateRealtimePreview();
        }

        function updateRealtimePreview() {
            let memberName = document.getElementById("inputTeamMember") ? document.getElementById("inputTeamMember").value.trim() : "";
            let headerTextElem = document.querySelector(".flex.flex-wrap.justify-between.items-center.mb-4 span.text-xs.text-slate-700.font-bold");
            let baseTeamName = "";
            if (headerTextElem) {
                baseTeamName = headerTextElem.innerText.replace("INPUT TID - ", "").trim();
            }
            
            let titleElem = document.getElementById("previewTeamTitle");
            if (titleElem && baseTeamName) {
                titleElem.innerText = baseTeamName + (memberName ? ` - ${memberName}` : "");
            }

            let inputs = document.querySelectorAll(".tid-input");
            
            inputs.forEach((inp, i) => {
                let tidRaw = inp.value.trim();
                let row = document.getElementById(`preview-row-${i}`);
                if (row) {
                    if (tidRaw !== "") {
                        let master = masterDatabase[tidRaw] || {};
                        
                        row.style.display = "";
                        row.cells[1].innerText = tidRaw;
                        row.cells[2].innerText = master.lokasi || `ATM-${tidRaw} (BEKASI)`;
                        row.cells[3].innerText = master.rpl || `RPL-${tidRaw}-99`;
                        row.cells[4].innerText = master.flm || "";
                        row.cells[5].innerText = master.rak || "";
                        row.cells[6].innerText = master.baris || "";
                        row.cells[7].innerText = master.kolom || "";
                    } else {
                        row.style.display = "none";
                    }
                }
            });
        }

        function clearAllTids(teamName) {
            if (confirm("Apakah Anda yakin ingin menghapus semua TID yang terisi di tabel ini?")) {
                const inputs = document.querySelectorAll(".tid-input");
                inputs.forEach(inp => inp.value = "");
                batchTeamsData[teamName] = [];
                saveLocalStorageData();
                updateRealtimePreview();
            }
        }

        function autoSaveDraft(teamName) {
            let memberName = document.getElementById("inputTeamMember") ? document.getElementById("inputTeamMember").value.trim() : "";
            let inputs = document.querySelectorAll(".tid-input");
            let tids = [];
            inputs.forEach(inp => {
                if(inp.value.trim() !== "") tids.push(inp.value.trim());
            });

            batchTeamsData[teamName] = tids;
            if(memberName) batchTeamMembers[teamName] = memberName;
            saveLocalStorageData();
        }

        function saveAndReturnMenu(teamName) {
            autoSaveDraft(teamName);
            renderTeamMenuHtml();
        }

        function saveTeamAndPrint(teamName) {
            autoSaveDraft(teamName);
            let tids = batchTeamsData[teamName] || [];
            if (tids.length === 0) {
                alert("Harap masukkan minimal 1 TID!");
                return;
            }
            let singleData = {};
            singleData[teamName] = tids;
            preparePreview(singleData);
        }

        function setupExcelInteractions(teamName) {
            const inputs = document.querySelectorAll(".tid-input");
            const containers = document.querySelectorAll(".cell-container");
            let isMouseDown = false;
            let startIndex = null;

            containers.forEach((container, idx) => {
                container.addEventListener("mousedown", function(e) {
                    if (e.ctrlKey) {
                        e.preventDefault();
                        container.classList.toggle("tid-cell-selected");
                        return;
                    }

                    isMouseDown = true;
                    startIndex = idx;
                    if (!e.shiftKey) { clearSelection(); }
                    selectCell(idx);
                });

                container.addEventListener("mouseenter", function() {
                    if (isMouseDown && startIndex !== null) {
                        clearSelection();
                        let min = Math.min(startIndex, idx);
                        let max = Math.max(startIndex, idx);
                        for (let i = min; i <= max; i++) { selectCell(i); }
                    }
                });
            });

            document.addEventListener("mouseup", function() { isMouseDown = false; });

            function selectCell(index) { containers[index].classList.add("tid-cell-selected"); }
            function clearSelection() { containers.forEach(c => c.classList.remove("tid-cell-selected")); }

            inputs.forEach(input => {
                input.addEventListener("keydown", function(e) {
                    let currentIndex = parseInt(this.getAttribute("data-index"));

                    if (e.ctrlKey && e.key.toLowerCase() === 'a') {
                        e.preventDefault();
                        containers.forEach(c => c.classList.add("tid-cell-selected"));
                        return;
                    }

                    if (e.key === "Delete" || e.key === "Backspace") {
                        let selectedContainers = document.querySelectorAll(".tid-cell-selected");
                        if (selectedContainers.length > 0) {
                            e.preventDefault();
                            selectedContainers.forEach(cont => {
                                let inp = cont.querySelector(".tid-input");
                                if (inp) inp.value = "";
                            });
                            autoSaveDraft(teamName);
                            updateRealtimePreview();
                        }
                    } else if (e.key === "Enter" || e.key === "ArrowDown") {
                        e.preventDefault();
                        let nextIndex = currentIndex + 1;
                        if (nextIndex < inputs.length) { clearSelection(); selectCell(nextIndex); inputs[nextIndex].focus(); }
                    } else if (e.key === "ArrowUp") {
                        e.preventDefault();
                        let prevIndex = currentIndex - 1;
                        if (prevIndex >= 0) { clearSelection(); selectCell(prevIndex); inputs[prevIndex].focus(); }
                    }
                });

                input.addEventListener("paste", function(e) {
                    e.preventDefault();
                    let clipboardData = e.clipboardData || window.clipboardData;
                    let pastedData = clipboardData.getData("Text");
                    let lines = pastedData.split(/\r?\n/).map(l => l.trim()).filter(l => l);
                    let startIndex = parseInt(this.getAttribute("data-index"));
                    lines.forEach((line, idx) => {
                        let targetIdx = startIndex + idx;
                        if (targetIdx < inputs.length) { inputs[targetIdx].value = line; }
                    });
                    autoSaveDraft(teamName);
                    updateRealtimePreview();
                });
            });
        }

        function preparePreview(dataDict) {
            previewPayload = [];
            for (let [tName, tids] of Object.entries(dataDict)) {
                if (!tids || tids.length === 0) continue;
                let memberName = batchTeamMembers[tName] ? ` - ${batchTeamMembers[tName]}` : "";
                let teamRows = [];
                tids.forEach((tid, i) => {
                    let master = masterDatabase[tid] || {};
                    teamRows.push([
                        i + 1,
                        tid,
                        master.lokasi || `ATM-${tid} (BEKASI)`,
                        master.rpl || `RPL-${tid}-99`,
                        master.flm || "",
                        master.rak || "",
                        master.baris || "",
                        master.kolom || "",
                        "",
                        ""
                    ]);
                });
                previewPayload.push({ team_name: tName + memberName, data: teamRows });
            }

            currentSlideIndex = 0;
            renderSlideView();
        }

        function renderSlideView() {
            const content = document.getElementById("contentArea");
            let totalPages = previewPayload.length;
            if (totalPages === 0) return;

            let item = previewPayload[currentSlideIndex];

            let html = `
                <div class="flex justify-between items-center mb-4 no-print bg-slate-100 p-2.5 rounded-lg shadow-sm border border-slate-200">
                    <button onclick="renderTeamMenuHtml()" class="bg-gradient-to-r from-slate-600 to-slate-700 hover:from-slate-700 hover:to-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow">⬅ Kembali ke Daftar Team</button>
                    
                    <div class="flex items-center gap-2">
                        <button onclick="prevSlide()" class="bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow ${currentSlideIndex === 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${currentSlideIndex === 0 ? 'disabled' : ''}>◀ Sebelumnya</button>
                        <span class="text-xs font-bold text-slate-700">Slide ${currentSlideIndex + 1} dari ${totalPages}</span>
                        <button onclick="nextSlide()" class="bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow ${currentSlideIndex === totalPages - 1 ? 'opacity-50 cursor-not-allowed' : ''}" ${currentSlideIndex === totalPages - 1 ? 'disabled' : ''}>Selanjutnya ▶</button>
                    </div>

                    <button onclick="window.print()" class="bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-700 hover:to-teal-800 text-white text-xs font-bold px-4 py-1.5 rounded shadow">🖨️ CETAK DOKUMEN</button>
                </div>

                <div id="printArea" class="border border-slate-300 bg-white p-4 rounded-xl shadow-md">
                    <table class="w-full border-collapse text-base rounded-lg overflow-hidden shadow-sm">
                        <thead>
                            <tr>
                                <th colspan="10" class="bg-gradient-to-r from-slate-200 via-slate-300 to-slate-200 text-slate-900 border-2 border-slate-400 p-3.5 text-left font-extrabold text-lg shadow-sm">${item.team_name}</th>
                            </tr>
                            <tr class="bg-gradient-to-r from-slate-400 via-slate-500 to-slate-400 text-white font-bold shadow-inner text-base">
                                <th class="border border-slate-500 p-3 w-14 font-bold shadow-sm text-center">NO</th>
                                <th class="border border-slate-500 p-3 w-28 font-bold shadow-sm text-center">TID</th>
                                <th class="border border-slate-500 p-3 px-4 text-center whitespace-nowrap font-bold shadow-sm">LOKASI</th>
                                <th class="border border-slate-500 p-3 px-2 text-center w-[130px] truncate font-bold shadow-sm">BARCODE RPL</th>
                                <th class="border border-slate-500 p-3 px-2 text-center w-[130px] truncate font-bold shadow-sm">BARCODE FLM</th>
                                <th class="border border-slate-500 p-3 w-16 font-bold shadow-sm text-center">RAK</th>
                                <th class="border border-slate-500 p-3 w-16 font-bold shadow-sm text-center">BARIS</th>
                                <th class="border border-slate-500 p-3 w-16 font-bold shadow-sm text-center">KOLOM</th>
                                <th class="border border-slate-500 p-3 w-28 font-bold shadow-sm text-center">KETERANGAN</th>
                                <th class="border border-slate-500 p-3 w-16 font-bold shadow-sm text-center"></th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            item.data.forEach((row, rIdx) => {
                let bg = rIdx % 2 === 0 ? "bg-slate-50/80" : "bg-white";
                html += `
                    <tr class="${bg}">
                        <td class="border border-slate-300 p-3 text-center text-base">${row[0]}</td>
                        <td class="border border-slate-300 p-3 text-center font-bold text-blue-900 text-base">${row[1]}</td>
                        <td class="border border-slate-300 p-3 px-4 text-center whitespace-nowrap text-base">${row[2]}</td>
                        <td class="border border-slate-300 p-3 px-2 text-center font-mono truncate max-w-[130px] text-base">${row[3]}</td>
                        <td class="border border-slate-300 p-3 px-2 text-center font-mono truncate max-w-[130px] text-base">${row[4]}</td>
                        <td class="border border-slate-300 p-3 text-center text-base">${row[5]}</td>
                        <td class="border border-slate-300 p-3 text-center text-base">${row[6]}</td>
                        <td class="border border-slate-300 p-3 text-center text-base">${row[7]}</td>
                        <td class="border border-slate-300 p-3 text-center text-base">${row[8]}</td>
                        <td class="border border-slate-300 p-3 text-center text-base">${row[9]}</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            content.innerHTML = html;
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderSlideView();
            }
        }

        function nextSlide() {
            if (currentSlideIndex < previewPayload.length - 1) {
                currentSlideIndex++;
                renderSlideView();
            }
        }
    </script>
</body>
</html>
