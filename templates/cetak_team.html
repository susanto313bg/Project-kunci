<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Cetak Dokumen Kunci Per Team</title>
    <style>
        /* Mengatur ukuran kertas cetak landscape dan margin */
        @page {
            size: A4 landscape;
            margin: 15mm;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #000000;
        }

        /* Pembungkus tiap team agar otomatis pindah halaman (slide) saat dicetak */
        .page-container {
            width: 300px; /* Lebar tabel disesuaikan agar pas ramping ke bawah */
            page-break-after: always;
            break-after: page;
            margin-bottom: 30px;
            display: inline-block;
            vertical-align: top;
            margin-right: 20px;
        }

        .page-container:last-child {
            page-break-after: avoid;
            break-after: avoid;
        }

        /* Desain Tabel */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11pt;
        }

        th, td {
            border: 1px solid #000000;
            padding: 6px 10px;
            text-align: left;
        }

        /* Baris Paling Atas (Kotak Nama Team) */
        .header-team th {
            background-color: #f6ad55; /* Warna Oranye / Kuning Emas */
            color: #000000;
            font-size: 11pt;
            font-weight: bold;
            text-transform: uppercase;
            text-align: left;
        }

        /* Baris Header Kolom (NO & TID) dengan Background Hijau */
        .header-kolom th {
            background-color: #28a745; /* Warna Hijau */
            color: #ffffff;
            font-size: 10pt;
            font-weight: bold;
        }

        /* Kolom Nomor agar berada di tengah dan rapat */
        .col-no {
            width: 20%;
            text-align: center;
        }

        /* Tinggi baris isi data agar longgar ke bawah seperti gambar */
        td {
            height: 22px;
        }
    </style>
</head>
<body>

    <!-- Looping data team dari Flask Backend -->
    {% for team in list_team %}
    <div class="page-container">
        <table>
            <!-- Baris Nama Team di Paling Atas -->
            <tr class="header-team">
                <th colspan="2">{{ team.nama_team }}</th>
            </tr>
            <!-- Baris Header Kolom NO dan TID -->
            <tr class="header-kolom">
                <th class="col-no">NO</th>
                <th>TID</th>
            </tr>
            <!-- Isi Baris Data 1 sampai 16 (atau sesuai data item) -->
            <tbody>
                {% for item in team.items %}
                <tr>
                    <td class="col-no">{{ loop.index }}</td>
                    <td><b>{{ item.tid }}</b></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% endfor %}

    <!-- Script otomatis memunculkan dialog print -->
    <script>
        window.onload = function() {
            // window.print(); // Uncomment jika ingin langsung otomatis membuka dialog cetak
        }
    </script>
</body>
</html>
